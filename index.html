<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curso PRL · Personal de cátering</title>
<meta name="description" content="Formación PRL (art. 19 Ley 31/1995) para el puesto de personal de cátering: riesgos del puesto, medidas preventivas, emergencias y vigilancia de la salud.">
<style>
html{--bg:#eef5f9;--card:#fff;--txt:#1d2b36;--mut:#4a5a68;--pri:#0277ab;--pri2:#009CD7;--acc:#128a3c;--acc2:#16B14C;--bd:#d6e4ec;--ok:#15803d;--ko:#c62828;--amb:#a15c00;--navy:#06476b;--navy2:#0277ab;--btnTxt:#fff;--tagTxt:#035f8c}
html[data-theme=dark]{--bg:#06131c;--card:#0d2130;--txt:#e8f0f6;--mut:#a9bccb;--pri:#4cc0f0;--pri2:#38b6ec;--acc:#3ddc84;--acc2:#3ddc84;--bd:#24445a;--ok:#22c55e;--ko:#ff6b6b;--amb:#fbbf24;--navy:#041e2e;--navy2:#06476b;--btnTxt:#04121d;--tagTxt:#9fdcf7}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;transition:background .3s,color .3s;overflow-x:hidden;
background-image:radial-gradient(1100px 600px at 100% -10%,color-mix(in srgb,var(--pri2) 12%,transparent),transparent 60%),linear-gradient(color-mix(in srgb,var(--pri) 5%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--pri) 5%,transparent) 1px,transparent 1px);background-size:auto,32px 32px,32px 32px;background-attachment:fixed}
a{color:var(--pri)}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;border-bottom:3px solid var(--acc2);box-shadow:0 4px 18px #0003}
header h1{font-size:1rem;margin:0;flex:1;display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap;overflow:hidden}
header h1 span{overflow:hidden;text-overflow:ellipsis}
header button{background:#ffffff1a;border:1px solid #ffffff40;color:#fff}
.logo-h{height:34px;background:#fff;border-radius:8px;padding:3px 8px;display:block;flex:none}
.prog{flex:2;max-width:320px;height:8px;background:#ffffff30;border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#009CD7,#16B14C);transition:width .5s}
#pct{font-size:.85rem}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--txt);border-radius:9999px;padding:7px 14px;transition:transform .15s,background .2s}button:hover{transform:translateY(-1px)}
.btn{background:var(--pri);color:var(--btnTxt);border:none;font-weight:700;box-shadow:0 4px 12px color-mix(in srgb,var(--pri) 30%,transparent)}
.wrap{display:flex;max-width:1240px;margin:auto}
nav{width:290px;flex:none;padding:16px;position:sticky;top:59px;height:calc(100vh - 59px);overflow:auto;background:color-mix(in srgb,var(--card) 70%,transparent)}
nav a{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;color:var(--txt);text-decoration:none;margin-bottom:2px;cursor:pointer;font-size:.88rem}
nav a:hover{background:color-mix(in srgb,var(--pri) 10%,transparent)}
nav a.on{background:linear-gradient(90deg,var(--pri),var(--pri2));color:var(--btnTxt)}nav a .ck{margin-left:auto}
nav details.ng{background:none;border:none;margin:6px 0}nav details.ng summary{padding:8px 10px;font-size:.92rem}nav details.ng summary small{color:var(--mut);font-weight:400}
main{flex:1;padding:22px;min-width:0}
.view{animation:fade .45s ease}@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1,h2,h3,h4{letter-spacing:-.01em;line-height:1.25}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 1px 2px #0000000d,0 8px 24px #0a1f330d}
.lc{cursor:pointer;transition:transform .2s,box-shadow .2s}.lc:hover{transform:translateY(-4px);box-shadow:0 10px 24px #00000022}
.tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.03em;border-radius:99px;padding:2px 10px;background:color-mix(in srgb,var(--pri2) 14%,var(--card));color:var(--tagTxt);border:1px solid color-mix(in srgb,var(--pri2) 35%,transparent)}
.tag.t2{background:color-mix(in srgb,var(--acc) 14%,var(--card));color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
details.bl{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:10px 0;overflow:hidden}
details.bl summary{padding:14px 16px;font-weight:700;cursor:pointer;list-style:none}details.bl summary::-webkit-details-marker{display:none}
details.bl summary::after{content:"＋";float:right;color:var(--pri)}details.bl[open] summary::after{content:"－"}
details.bl>div{padding:0 16px 14px}
.key{border-left:5px solid var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.note{border-left:5px solid var(--pri2);background:color-mix(in srgb,var(--pri2) 9%,var(--card));padding:12px 14px;border-radius:10px;margin:10px 0}
.alert{border-left:5px solid var(--ko);background:color-mix(in srgb,var(--ko) 9%,var(--card));padding:12px 14px;border-radius:10px;margin:10px 0}
.caso{border:2px dashed color-mix(in srgb,var(--pri) 55%,transparent);background:color-mix(in srgb,var(--pri) 6%,var(--card));padding:12px 14px;border-radius:12px;margin:12px 0}
.caso>b:first-child{color:var(--pri)}
.tbl{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}table{border-collapse:collapse;width:100%;min-width:480px;font-size:.92rem}th,td{border:1px solid var(--bd);padding:8px 10px;text-align:left;vertical-align:top}th{background:color-mix(in srgb,var(--pri) 15%,var(--card))}
.sem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}.sem>div{border-radius:12px;padding:12px;border:2px solid}
.sv{border-color:#16B14C!important;background:color-mix(in srgb,#16B14C 10%,var(--card))}.sa{border-color:#f59e0b!important;background:color-mix(in srgb,#f59e0b 12%,var(--card))}.sr{border-color:#e53935!important;background:color-mix(in srgb,#e53935 10%,var(--card))}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}.flow span{background:color-mix(in srgb,var(--pri) 12%,var(--card));border:1px solid color-mix(in srgb,var(--pri) 40%,transparent);border-radius:10px;padding:6px 10px;font-size:.88rem}.flow i{font-style:normal;color:var(--pri);font-weight:800}
.q{margin:16px 0}.q p{font-weight:700;margin:.2em 0 .5em}.opt{display:block;width:100%;text-align:left;margin:6px 0;border-radius:12px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.ko{background:var(--ko);color:#fff;border-color:var(--ko)}.opt:disabled{cursor:default;transform:none;opacity:1}
html[data-theme=dark] .opt.ok,html[data-theme=dark] .opt.ko{color:#04121d}
.fb{font-size:.9rem;min-height:1.2em;font-weight:600}.score{font-size:1.15rem;font-weight:800}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
figure{margin:12px 0;text-align:center}figure img{max-width:100%;border-radius:12px;border:1px solid var(--bd);cursor:zoom-in;background:#fff}figcaption{font-size:.8rem;color:var(--mut)}
.lb{position:fixed;inset:0;background:#000e;z-index:1000;overflow:auto;touch-action:pinch-zoom pan-x pan-y;animation:fade .2s}.lbw{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 10px 16px;box-sizing:border-box}.lb img{max-width:min(96vw,2000px);max-height:84vh;width:auto;height:auto;border-radius:8px;background:#fff;cursor:zoom-in;border:0}.lb.z .lbw{align-items:flex-start;justify-content:flex-start}.lb.z img{max-width:none;max-height:none;width:auto;cursor:zoom-out}.lbh{color:#dfe9f0;font-size:.82rem;margin:10px 0 0;text-align:center}.lbx{position:fixed;top:10px;right:10px;z-index:2;width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:#0b3a55;color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer}.lbx:focus-visible,figure img:focus-visible{outline:3px solid #16B14C;outline-offset:3px}html.lbo{overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mut);font-size:.88rem;margin:4px 0 8px}
.hx{position:relative;overflow:hidden;border-radius:22px;color:#fff;padding:40px 34px;background:linear-gradient(135deg,var(--navy) 0%,#035f8c 55%,#0291CE 100%);box-shadow:0 20px 50px #0a1f3355;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center}
.hx::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#009CD7 0 50%,#16B14C 50% 100%)}
.hx>*{position:relative;min-width:0}
.logo-x{height:54px;background:#fff;border-radius:12px;padding:6px 12px;margin-bottom:14px;box-shadow:0 6px 18px #0003;max-width:100%}
.eyb{display:inline-flex;align-items:center;gap:8px;font-size:.76rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9ff0bb}
.eyb::before{content:"";width:26px;height:2px;background:#16B14C}
.hx h2{font-size:clamp(1.7rem,4.4vw,3.1rem);line-height:1.07;margin:.35em 0 .3em;font-weight:800}
.hx h2 em{font-style:normal;color:#9ff0bb}
.hx p.sub{font-size:1.04rem;color:#e1eef7;max-width:580px;margin:0 0 20px}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.go{background:#0f7a35;color:#fff;border:none;font-weight:800;padding:13px 26px;font-size:1.02rem;box-shadow:0 8px 24px #16b14c55}
.go2{background:transparent;color:#fff;border:1px solid #ffffff66;padding:12px 18px}
.pbar{margin-top:18px;max-width:420px}.pbar small{color:#d3e4f0}.pbar div{height:8px;border-radius:9px;background:#ffffff26;overflow:hidden;margin-top:4px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#009CD7,#16B14C)}




@keyframes blink{50%{opacity:.2}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 6px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;border-top:3px solid var(--acc2)}
.stat b{display:block;font-size:1.6rem;line-height:1.1;color:var(--pri)}.stat span{font-size:.85rem;color:var(--mut)}
.mods{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:8px 0 10px}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;position:relative;overflow:hidden}
.mc .n{font-size:2.6rem;font-weight:800;color:color-mix(in srgb,var(--pri2) 25%,transparent);position:absolute;right:14px;top:4px}
.mc h3{margin:.4em 0 .2em;font-size:1.02rem}.mc p{margin:0;color:var(--mut);font-size:.88rem}
.mp{height:6px;background:var(--bd);border-radius:9px;margin-top:12px;overflow:hidden}.mp i{display:block;height:100%;background:linear-gradient(90deg,#009CD7,#16B14C)}
.sech{display:flex;align-items:center;gap:10px;margin:26px 0 4px;font-size:.8rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}.sech::after{content:"";flex:1;height:1px;background:var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:14px}
.grid .card{margin:0}.grid h4{margin:.4em 0}
.hero{background:linear-gradient(135deg,var(--navy),#035f8c 60%,#0291CE);color:#fff;border-radius:18px;padding:26px}
.hero h2{margin:.2em 0}
.ofc{width:100%;max-width:460px;justify-self:center}.himg{height:auto;border-radius:16px;background:#fff;cursor:zoom-in;box-shadow:0 8px 24px #0003}
.ofc .cur{animation:blink 1.1s steps(1) infinite}}
.ofc .arm{animation:type .5s ease-in-out infinite alternate;transform-origin:246px 136px}
@keyframes type{from{transform:rotate(0)}to{transform:rotate(-1.5deg)}}}}
.ofc .plant{animation:sw 4s ease-in-out infinite;transform-origin:35px 174px}@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
}
.vb{display:inline-block;font-size:.78rem;font-weight:800;border-radius:99px;padding:1px 10px;border:1px solid;white-space:nowrap}
.v-trivial{background:#e6f4ea;color:#14532d;border-color:#15803d}.v-tolerable{background:#e0f2fe;color:#0c4a6e;border-color:#0369a1}.v-moderado{background:#fef3c7;color:#713f12;border-color:#a16207}.v-importante{background:#ffedd5;color:#7c2d12;border-color:#c2410c}.v-intolerable{background:#fee2e2;color:#7f1d1d;border-color:#b91c1c}
.rk{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;border:1px solid var(--bd);border-left:5px solid var(--pri);border-radius:12px;padding:10px 12px;margin:10px 0;background:color-mix(in srgb,var(--pri) 5%,var(--card))}.rk small{color:var(--mut)}
.rc{font-weight:800;font-size:.8rem;background:var(--pri);color:var(--btnTxt);border-radius:8px;padding:1px 8px}
.ley{border-left:5px solid #7c3aed;background:color-mix(in srgb,#7c3aed 9%,var(--card));padding:12px 14px;border-radius:10px;margin:10px 0}
html[data-theme=dark] .ley{border-color:#c4b5fd}


button:disabled{opacity:.55;cursor:not-allowed}
.ub{max-width:200px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}.ub span{overflow:hidden;text-overflow:ellipsis}
body.noauth nav,body.noauth .prog,body.noauth #pct{display:none}
.auth{max-width:760px;margin:auto}.ah{grid-template-columns:1.3fr 1fr}.ah .ofc{max-width:260px}
.tabs{display:flex;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.af label{display:block;font-weight:700;margin:10px 0;font-size:.92rem}.af input:not([type=checkbox]),.af select{display:block;width:100%;font:inherit;font-weight:400;padding:10px 12px;margin-top:4px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--txt)}
.af input:focus,.af select:focus{outline:3px solid color-mix(in srgb,var(--pri) 45%,transparent)}
.af .chk{display:flex;gap:8px;align-items:flex-start;font-weight:600}.af .chk input{width:20px;height:20px;flex:none;margin-top:2px}
.rgpd{font-size:.82rem}.err{color:var(--ko);font-weight:700;min-height:1.2em}
.sw{text-align:left}
[hidden]{display:none!important}nav a.lk{opacity:.6}nav a.lk .ck{opacity:1}.lockv h2{margin-top:0}#menu{display:none}
ul,ol{padding-left:1.3em}li{margin:3px 0}
@media(max-width:1000px){.mods{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.hx{grid-template-columns:1fr;padding:28px 20px 32px}.ofc{max-width:260px;order:-1}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){nav{position:fixed;left:0;top:59px;background:var(--card);z-index:9;transform:translateX(-105%);transition:transform .3s;border-right:1px solid var(--bd);width:min(290px,86vw)}nav.open{transform:none}#menu{display:inline-block}.prog{display:none}}
@media(max-width:600px){main{padding:14px 12px}.mods{grid-template-columns:1fr}.sem{grid-template-columns:1fr}.logo-h{height:28px}.logo-x{height:44px}header{gap:8px;padding:10px}header h1{font-size:.88rem}.card{padding:14px}details.bl>div{padding:0 12px 12px}}
@media(max-width:420px){#pct{display:none}.ub{max-width:110px;padding:6px 10px}.ah{padding:22px 16px}header h1 span{max-width:40vw}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header,nav,.pn,.noprint,.alert{display:none!important}main{padding:0}body{background:#fff;color:#000}.wrap{display:block}details.bl{break-inside:avoid}}
.fig{margin:.3rem 0 .9rem}.fig svg{display:block;width:100%;height:auto;max-width:520px;margin:0 auto;border-radius:14px;border:1px solid var(--bd)}.fig img{cursor:zoom-in;display:block;width:100%;height:auto;max-width:720px;margin:0 auto;border-radius:14px;border:1px solid var(--bd);background:#fff}.fig figcaption{font-size:.86rem;color:var(--mut);text-align:center;margin-top:.35rem}
.sigf .chk input[type=radio]{width:20px;height:20px;flex:none;margin:2px 0 0;padding:0;display:inline-block}.sigf p{font-size:.95rem}.sigf h3{margin-top:1.2em}.sigf h3:first-child{margin-top:0}.sgg{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:10px 0}.sgg label{display:flex;flex-direction:column;gap:4px;font-weight:600}.sgr{display:grid;gap:8px;margin:10px 0}.sgr .chk{border:1px solid var(--bd);border-radius:12px;padding:10px 12px}.sigbox{position:relative;border:2px dashed var(--pri);border-radius:12px;background:#fff;height:190px;max-width:620px}.sigbox canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;border-radius:12px}.sigph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa9b5;font-size:1.3rem;pointer-events:none;font-style:italic}@media(max-width:600px){.sgg{grid-template-columns:1fr}}
</style>
</head>

const M1={t:"Tu puesto: normativa, evaluación de riesgos y tareas",fmin:3,s:"La normativa que te protege, cómo se evalúan y se previenen los riesgos y el mapa de tareas y riesgos del personal de cátering.",L:[
{t:"La normativa que te protege",ico:"⚖️",min:7,src:"Ley 31/1995, arts. 14, 18-22 y 29; RD 39/1997",obj:["Conocer la base legal de la prevención: Ley 31/1995 y RD 39/1997.","Identificar tus derechos de información, formación, participación y vigilancia de la salud.","Saber qué hacer ante un riesgo grave e inminente y cuáles son tus obligaciones."],b:[["1. Marco general",FIGI("assets/l01-marco.webp","Trabajadora de cátering leyendo un manual de prevención en la mesa de la cocina","La prevención se traduce en hábitos diarios: conocer los riesgos de cada servicio, aplicar las medidas y avisar cuando algo no está bien.")+"<p>La <b>Ley 31/1995 de Prevención de Riesgos Laborales</b> (LPRL) es la base del sistema preventivo en España. El <b>RD 39/1997</b>, Reglamento de los Servicios de Prevención, regula cómo se evalúan los riesgos y cómo se organiza la prevención.</p>"+UL(["La empresa <b>evalúa, planifica y revisa</b> los riesgos de cada puesto, organiza la prevención y te facilita medios seguros y los equipos de protección necesarios.","Tú <b>aplicas las instrucciones</b>, usas correctamente los equipos y las protecciones, colaboras y <b>comunicas las incidencias</b>, aunque no haya habido ningún daño."])+NOTE("<b>Este curso cumple la parte teórica de la formación del artículo 19 LPRL</b> para el puesto de personal de cátering (montaje, servicio y recogida). Se completa con la información concreta de tu empresa y de cada lugar de trabajo (plan de emergencias, equipos que usas, normas del centro) y con la formación práctica en tu puesto.")],["2. Información, formación y participación",LEY("Art. 19.1 Ley 31/1995: el empresario deberá garantizar que cada trabajador reciba una formación teórica y práctica, suficiente y adecuada, en materia preventiva, tanto en el momento de su contratación como cuando se produzcan cambios en las funciones que desempeñe o se introduzcan nuevas tecnologías o cambios en los equipos de trabajo.")+UL(["Tienes derecho a recibir <b>información</b> sobre los riesgos de tu puesto y de los lugares donde trabajas, y sus medidas preventivas (art. 18), y a una <b>formación</b> suficiente, dentro de la jornada o descontando ese tiempo, y <b>sin coste</b> para ti (art. 19).","La formación se repite o actualiza cuando cambian tus funciones o los equipos (por ejemplo, empezar a usar un tirador de cerveza, una freidora o conducir la furgoneta de reparto).","Puedes hacer propuestas de mejora y participar a través de los delegados de prevención o directamente con la empresa (arts. 18 y 33-36)."])],["3. Vigilancia de la salud y riesgo grave e inminente",UL(["La empresa te ofrecerá la <b>vigilancia de la salud</b> (art. 22). Por norma general es <b>voluntaria</b> y <b>confidencial</b>: la empresa solo conoce si eres apto o no para el puesto. Lo que corresponde desde el punto de vista médico lo decide el <b>médico del trabajo</b>.","Ante un <b>riesgo grave e inminente</b> (olor a gas, un cuadro eléctrico que echa chispas, una carpa que se vuelca con el viento) tienes derecho a <b>interrumpir la actividad y abandonar la zona</b> (art. 21), avisando enseguida a tu responsable."])+ALERT("<b>Tus obligaciones (art. 29):</b> usar adecuadamente los equipos, las herramientas y los productos; utilizar los equipos de protección; no anular los dispositivos de seguridad; informar de inmediato de cualquier situación de riesgo y cooperar con la empresa. Su incumplimiento puede considerarse falta laboral.")]],key:"La empresa evalúa, planifica y te da medios seguros; tú aplicas las instrucciones, usas las protecciones y comunicas. Tienes derecho a información, formación gratuita y adecuada, participación y vigilancia de la salud voluntaria y confidencial. Ante un riesgo grave e inminente, interrumpe, aléjate y avisa.",q:[["¿Qué ley es la base del sistema de prevención de riesgos laborales en España?",["La Ley 31/1995 de Prevención de Riesgos Laborales","El Estatuto de los Trabajadores únicamente","El Código Civil","La Ley de Seguridad Vial"],0],["La formación preventiva de tu puesto:",["Es gratuita para ti y se hace en la jornada o descontando ese tiempo","La pagas tú y fuera de horario","Solo es obligatoria para los encargados","Se hace una sola vez en la vida laboral"],0],["La vigilancia de la salud es, por norma general:",["Voluntaria y confidencial; la empresa solo conoce la aptitud","Obligatoria y pública","Un trámite que decide tu encargado","Un examen cuyos resultados se cuelgan en el tablón"],0],["Durante un montaje notas olor a gas en la zona de cocina. Tienes derecho a:",["Interrumpir la actividad, alejarte y avisar enseguida","Seguir trabajando para no retrasar el servicio","Buscar la fuga con un mechero","Esperar al final del evento para comentarlo"],0],["¿Cuál de estas es una obligación del trabajador (art. 29 LPRL)?",["Informar de inmediato de las situaciones de riesgo y usar las protecciones","Reparar los equipos eléctricos averiados","Decidir qué EPI compra la empresa","Evaluar los riesgos del puesto"],0]]},
{t:"Cómo se evalúan y se previenen los riesgos",ico:"🛡️",min:7,src:"Ley 31/1995, arts. 15 y 16; RD 39/1997, arts. 3-9",obj:["Aplicar el orden de las medidas: eliminar, sustituir, controlar, organizar y proteger.","Entender de forma general cómo se valoran los riesgos.","Comunicar los incidentes aunque nadie se haya lesionado."],b:[["1. Elegir la medida que actúa en el origen",FIGI("assets/l02-evaluacion.webp","Responsable y trabajador de cátering revisando una lista de comprobación en la cocina","La evaluación de riesgos sirve para decidir qué medidas se aplican y con qué prioridad.")+"<p>Un <b>peligro</b> es una fuente de daño, como una superficie caliente o un suelo mojado. El <b>riesgo</b> depende de la posibilidad de sufrir ese daño y de su gravedad.</p>"+FLOW(["1 Eliminar","2 Sustituir","3 Controlar","4 Organizar","5 EPI"])+UL(["<b>Eliminar</b> el peligro: retirar la vajilla rota o el carro con una rueda bloqueada.","<b>Sustituir</b>: usar un producto de limpieza menos peligroso que sea igual de eficaz, o un carro en lugar de llevar cajas a mano.","<b>Controlar</b> el entorno: pasacables en las zonas de paso, resguardos en las máquinas, iluminación auxiliar.","<b>Organizar</b>: planificar tiempos de montaje y recogida, repartir las tareas, prever pausas y personal suficiente.","<b>EPI</b> (equipos de protección individual): calzado antideslizante, guantes térmicos o anticorte. Son la <b>última barrera</b>, cuando el riesgo no se ha podido evitar de otro modo."])],["2. Cómo se valoran los riesgos (explicación general)","<p>La empresa, con su servicio de prevención, <b>evalúa</b> los riesgos que no se han podido evitar (art. 16 LPRL). Un método muy utilizado combina dos factores:</p>"+UL(["La <b>probabilidad</b> de que se produzca el daño (baja, media o alta).","La <b>consecuencia</b> o gravedad del daño (leve, grave o muy grave)."])+T(["Consecuencia \\ Probabilidad","Baja","Media","Alta"],[["Leve","Trivial","Tolerable","Moderado"],["Grave","Tolerable","Moderado","Importante"],["Muy grave","Moderado","Importante","Intolerable"]])+"<p>Cuanto mayor es el nivel, más urgentes son las medidas: en un riesgo <b>importante</b> no debe comenzarse el trabajo hasta reducirlo, y en uno <b>intolerable</b> no se comienza ni se continúa. En este curso <b>no verás la valoración concreta de cada riesgo de tu puesto</b>: se explica el método para que entiendas por qué se priorizan unas medidas u otras. La evaluación se revisa cuando cambian los equipos o las tareas, tras un daño a la salud o cuando las medidas no resultan suficientes.</p>"],["3. Aprender de los incidentes","<p>Un <b>incidente</b>, como el vuelco de una bandeja sin lesiones o un calambre al enchufar la cafetera, <b>se comunica siempre</b>: permite corregir el problema antes de que ocurra un accidente.</p>"+UL(["Describe qué tarea hacías, dónde y qué falló.","El objetivo es corregir las condiciones y evitar que se repita, no buscar culpables.","Los accidentes, con baja o sin baja, se notifican según el procedimiento de la empresa."])]],key:"Primero se elimina o sustituye el peligro, después se controla el entorno y se organiza el trabajo; el EPI es la última barrera. Los riesgos se valoran combinando probabilidad y consecuencia. Los incidentes sin lesión también se comunican.",q:[["¿Cuál es el orden correcto de las medidas preventivas?",["Eliminar, sustituir, controlar, organizar y EPI","EPI, organizar, controlar, sustituir y eliminar","Solo EPI","Organizar y después eliminar"],0],["Para valorar un riesgo se combinan:",["La probabilidad de que ocurra el daño y su consecuencia","La edad del trabajador y su antigüedad","El número de invitados y el precio del menú","La marca de los equipos"],0],["Si un riesgo resulta «importante»:",["No debe comenzarse el trabajo hasta reducirlo","Se trabaja con normalidad","Se revisa dentro de cinco años","Se ignora si no ha habido lesiones"],0],["El calzado antideslizante y los guantes son, en la jerarquía preventiva:",["La última barrera, cuando el riesgo no se ha podido evitar de otro modo","La primera y única medida","Un sustituto de limpiar los derrames","Una medida que elimina el riesgo de raíz"],0],["Se vuelca una bandeja pero nadie se hace daño. Debes:",["Comunicarlo como incidente para corregir la causa","No decir nada porque no pasó nada","Ocultarlo para no retrasar el servicio","Esperar a que alguien se lesione para avisar"],0]]},
{t:"Mapa de tareas y riesgos del personal de cátering",ico:"🗺️",min:6,src:"Ley 31/1995, art. 16; evaluación de riesgos del puesto",obj:["Reconocer las tareas habituales del puesto de personal de cátering.","Relacionar cada tarea con sus principales riesgos.","Saber en qué lecciones se trata cada riesgo."],b:[["1. Qué hace el personal de cátering",FIGI("assets/l03-tareas.webp","Fases del servicio de cátering: carga de la furgoneta, montaje del bufé y servicio a los invitados","El trabajo se desarrolla en espacios ajenos y variables, principalmente de pie y con desplazamientos frecuentes.")+UL(["<b>Preparación y transporte</b>: cargar bandejas, isotermos, termos, menaje y mantelería; en su caso, conducir la furgoneta de reparto.","<b>Montaje</b> en domicilios, empresas o espacios de eventos: colocar mesas, carpas, equipos y la zona de servicio.","<b>Servicio</b>: distribuir y reponer alimentos y bebidas, atender a los asistentes, usar cafetera, microondas, tirador de cerveza o equipos de calor.","En algunos servicios, <b>elaboración o regeneración</b> de comida con hornos, freidoras, marmitas, planchas o cuchillos y máquinas de cocina.","<b>Recogida y limpieza</b>: retirar menaje, residuos y material, limpieza ocasional con productos de uso común y lavavajillas."])],["2. Tareas y riesgos",T(["Tarea","Riesgos principales"],[["Desplazamientos por el lugar del evento","Caídas al mismo y a distinto nivel, golpes, atropellos en zonas de carga"],["Cargar y transportar material","Sobreesfuerzos, caída de objetos, atrapamientos con carros y mesas"],["Montaje y desmontaje","Sobreesfuerzos, golpes, atrapamiento de dedos, caída de estructuras"],["Cocina y equipos de calor","Quemaduras, cortes, incendio, contacto eléctrico"],["Equipos de bebidas y gas","Contacto eléctrico, gases a presión, fugas de GLP o CO₂"],["Cámaras frigoríficas y eventos al aire libre","Estrés térmico por frío o por calor"],["Limpieza y recogida","Productos químicos, cortes con vidrio, agentes biológicos"],["Servicio y atención al público","Bipedestación prolongada, fatiga, turnos largos, conflictos con clientes"],["Conducción por trabajo","Accidentes de tráfico"]])+NOTE("Cada uno de estos riesgos se trata en una lección del curso. Al final encontrarás una lista de comprobaciones para aplicar en cada servicio.")]],key:"El personal de cátering prepara, transporta, monta, sirve y recoge en lugares ajenos y cambiantes. Sus principales riesgos son las caídas, los sobreesfuerzos, los cortes, las quemaduras, la electricidad y el gas, el frío y el calor, los productos de limpieza, la fatiga y la conducción.",q:[["¿Dónde trabaja habitualmente el personal de cátering?",["En domicilios, empresas y espacios de eventos, que cambian de un servicio a otro","Siempre en la misma cocina","Solo en restaurantes propios","Exclusivamente al aire libre"],0],["¿Qué riesgo se asocia sobre todo a cargar y transportar isotermos y cajas?",["Sobreesfuerzos y caída de objetos","Radiaciones ionizantes","Ruido de maquinaria pesada","Riesgo de ahogamiento"],0],["Los riesgos principales del uso de hornos, freidoras y marmitas son:",["Quemaduras, incendio y contacto eléctrico","Atrapamiento por prensas","Exposición a polvo de madera","Caída de rayos"],0],["Atender durante horas a los invitados de pie se relaciona con:",["Fatiga y carga física por bipedestación prolongada","Riesgo químico","Riesgo biológico grave","Ruido de impacto"],0]]}
]};
const M2={t:"Preparación del servicio y trabajo en lugares ajenos",fmin:3,s:"Planificar cada servicio, reconocer el lugar al llegar y coordinarse con las demás empresas presentes.",L:[
{t:"Antes de salir: planificar el servicio",ico:"📋",min:6,src:"Ley 31/1995, arts. 15 y 18; manual de prevención del puesto",obj:["Confirmar los datos del servicio antes de salir.","Comprobar el material, los equipos y las protecciones.","Organizar los tiempos para evitar las prisas."],b:[["1. Qué confirmar",FIGI("assets/l04-preparacion.webp","Trabajador de cátering revisando una lista de material junto a un carro con isotermos en el almacén","Un servicio bien preparado evita prisas, improvisaciones y esfuerzos innecesarios.")+UL(["El <b>lugar</b>, el <b>horario</b> y la <b>persona responsable</b> del servicio y del espacio.","El <b>número de personas</b> del equipo y el reparto de tareas.","El <b>material previsto</b> y si habrá cargas pesadas (barriles, cajas de bebidas, mesas) y cómo se moverán.","Si hay que conducir: vehículo asignado, permiso y autorización."])],["2. Qué comprobar",UL(["Que dispones de <b>carros adecuados</b>, en buen estado, y de recipientes con cierre.","Que los <b>equipos</b> (cafetera, microondas, calientaplatos, alargadores) están revisados y sin daños visibles.","Que llevas <b>calzado antideslizante</b> y las protecciones necesarias: guantes térmicos, guantes de limpieza, guantes anticorte si se usan cuchillos.","Que hay un <b>botiquín</b> y un medio de comunicación con tu responsable."])],["3. Organizar los tiempos","<p>Organiza el transporte, la descarga, el montaje y la recogida <b>con margen suficiente</b>. La prisa está detrás de muchas caídas, cortes y quemaduras.</p>"+ALERT("Si faltan medios, personal o instrucciones para hacer una tarea con seguridad, <b>avisa antes de salir</b>: es más fácil resolverlo en la base que en mitad del evento.")]],key:"Antes de salir confirma lugar, horario, responsable, equipo y material; comprueba carros, equipos, calzado y protecciones; y deja margen de tiempo. Si falta algo para trabajar con seguridad, avisa antes de salir.",q:[["Antes de salir hacia un servicio conviene confirmar:",["Lugar, horario, responsable, equipo de personas y material previsto","Solo la hora de llegada","Únicamente el menú","Nada: se improvisa al llegar"],0],["Si el servicio incluye barriles y cajas de bebida pesadas:",["Se planifica cómo moverlos con carros y entre varias personas","Se cargan a mano sin más","Lo hace una sola persona para ir más rápido","Se arrastran por el suelo"],0],["Organizar los tiempos con margen sirve para:",["Evitar prisas, que están detrás de muchos accidentes","Terminar antes y salir antes","Nada, no influye en la seguridad","Poder saltarse las pausas"],0],["Te das cuenta de que no hay guantes térmicos para el servicio. Debes:",["Avisar antes de salir para que se resuelva","Usar servilletas de tela","Coger las bandejas calientes con las manos","No decir nada"],0]]},
{t:"Al llegar: reconocer el lugar de trabajo",ico:"📍",min:6,src:"RD 486/1997; RD 171/2004; manual de prevención del puesto",obj:["Localizar accesos, punto de descarga e itinerarios.","Detectar condiciones inseguras del espacio.","Distribuir mesas, equipos y residuos sin bloquear salidas."],b:[["1. Recorrer el itinerario",FIGI("assets/l05-llegada.webp","Dos trabajadores de cátering observando el acceso de servicio de un espacio de eventos con rampa y escalones","Unos minutos al llegar para revisar el recorrido evitan muchos accidentes durante el montaje.")+UL(["Localiza el <b>acceso de personal</b>, el <b>punto de descarga</b> y el itinerario hasta la zona de servicio.","Revisa <b>escalones, pendientes, suelos húmedos, cables, puertas, zonas con poca luz</b> y la circulación de vehículos.","Solicita que se corrijan las condiciones que impidan trabajar con seguridad (por ejemplo, iluminación o un acceso sin obstáculos)."])],["2. Distribuir la zona de servicio",UL(["Acuerda con el responsable la ubicación de mesas, equipos, materiales y residuos.","Mantén separados los recorridos de carros y las zonas con público siempre que sea posible.","<b>No ocupes</b> salidas de emergencia, extintores, cuadros eléctricos ni vías de evacuación.","Sitúa los equipos eléctricos cerca de tomas adecuadas, lejos del agua y de las zonas de paso."])],["3. Información que debes recibir","<p>Debes conocer los riesgos propios del lugar, las zonas restringidas, las normas de uso de las instalaciones, las <b>salidas de emergencia</b>, el <b>punto de reunión</b> y la forma de dar la alarma.</p>"+NOTE("En un <b>domicilio particular</b> también se acuerdan los accesos y las condiciones básicas de seguridad: animales apartados, zonas de paso libres y un lugar estable para los equipos.")]],key:"Al llegar, recorre el itinerario y detecta escalones, suelos húmedos, cables o poca luz; pide que se corrija lo que impida trabajar seguro; distribuye la zona sin ocupar salidas, extintores ni cuadros, y conoce las salidas y el punto de reunión.",q:[["Al llegar al lugar del evento, lo primero es:",["Localizar el acceso, el punto de descarga y revisar el itinerario","Empezar a descargar sin mirar","Montar las mesas en cualquier sitio","Buscar dónde enchufar la radio"],0],["¿Qué NO debe ocuparse nunca con mesas o material?",["Salidas de emergencia, extintores y cuadros eléctricos","Las zonas de servicio previstas","El almacén asignado","La zona de descarga acordada"],0],["Si la iluminación del recorrido de carga es insuficiente:",["Se solicita iluminación auxiliar o se corrige antes de trabajar","Se trabaja igual con más prisa","Se usa la linterna del móvil mientras se carga","Se ignora"],0],["En cualquier lugar de trabajo debes conocer:",["Las salidas de emergencia, el punto de reunión y cómo dar la alarma","El menú de los invitados","El nombre de todos los invitados","La contraseña del wifi"],0]]},
{t:"Coordinación de actividades empresariales",ico:"🤝",min:6,src:"Ley 31/1995, art. 24; RD 171/2004",obj:["Entender qué es la coordinación de actividades empresariales.","Saber qué información recibes y qué debes comunicar.","Actuar cuando trabajan varias empresas en el mismo espacio."],b:[["1. Varias empresas en el mismo lugar",FIGI("assets/l06-coordinacion.webp","Responsable de cátering conversando con el responsable del espacio que señala el plano de evacuación","En un evento coinciden el titular del espacio, montadores, sonido, seguridad y cátering: hay que coordinarse.")+"<p>Cuando en un mismo centro trabajan varias empresas (titular del espacio, montaje, iluminación y sonido, seguridad, limpieza, cátering…), la ley obliga a <b>coordinarse</b> para que los riesgos de unas no afecten a las otras (<b>art. 24 LPRL y RD 171/2004</b>).</p>"+UL(["El <b>titular del centro</b> informa de los riesgos del lugar, las medidas y el plan de emergencia.","Tu <b>empresa</b> gestiona ese intercambio de información y te traslada las instrucciones.","Tú <b>aplicas las instrucciones</b> recibidas y comunicas los riesgos que generas o detectas."])],["2. En la práctica",UL(["Respeta las <b>zonas restringidas</b> (escenarios, zonas de montaje con máquinas elevadoras, cuadros eléctricos).","Avisa si tu tarea puede afectar a otros: un suelo mojado, cables de tus equipos, una zona de cocina con gas.","No uses equipos ni instalaciones de otras empresas o del cliente sin autorización.","Si el cliente te propone una tarea o un equipo distinto de lo previsto, <b>consulta antes con tu responsable</b>."])+CASO("Una tarea fuera de lo previsto","El organizador te pide que subas a una escalera del local para colgar una guirnalda sobre el escenario.","No la realizas sin consultar: no es tu tarea habitual, no conoces el equipo y puede haber riesgos del montaje. Lo comunicas a tu responsable, que valorará si se puede hacer y con qué medios.")]],key:"Cuando coinciden varias empresas hay que coordinarse: el titular informa de los riesgos y la emergencia, tu empresa te traslada las instrucciones y tú las aplicas y comunicas los riesgos que generas o detectas. Ante tareas o equipos no previstos, consulta antes.",q:[["La coordinación de actividades empresariales se regula en:",["El art. 24 de la LPRL y el RD 171/2004","El Código Penal","La normativa de tráfico","El convenio de hostelería únicamente"],0],["¿Quién informa de los riesgos del lugar y del plan de emergencia?",["El titular del centro, y tu empresa te traslada las instrucciones","Los invitados","Nadie, cada uno se informa solo","El proveedor de bebidas"],0],["Tu tarea va a dejar el suelo mojado en una zona por la que pasan montadores:",["Lo señalizas y avisas a las otras empresas","No dices nada","Esperas a que alguien resbale","Lo dejas para el final del evento"],0],["El cliente te pide usar su escalera para colgar decoración en altura:",["Consultas antes con tu responsable","La usas sin más","Te subes a una silla","Lo haces mientras nadie mira"],0]]}
]};
const M3={t:"Espacios de trabajo: caídas, golpes y objetos",fmin:3,s:"Resbalones, tropiezos y caídas a distinto nivel, caída de objetos y atrapamientos durante el montaje y el servicio.",L:[
{t:"Suelos mojados, orden y calzado",ico:"💧",min:6,src:"RD 486/1997, anexos I y II; manual de prevención del puesto",obj:["Identificar las causas de resbalones y tropiezos en el servicio.","Limpiar y señalizar los derrames.","Usar el calzado adecuado."],b:[["1. Por qué se resbala y se tropieza",FIGI("assets/l07-suelos.webp","Trabajadora de cátering con calzado antideslizante fregando un derrame junto al bufé con un cono de suelo mojado","Un derrame limpiado y señalizado a tiempo evita la caída más frecuente del sector.")+"<p>Las <b>caídas al mismo nivel</b> son uno de los accidentes más frecuentes en hostelería y cátering. Sus causas habituales: bebidas, agua o hielo en el suelo, restos de comida, cajas, manteles que cuelgan, cables, desniveles y zonas oscuras. Las <b>bandejas que tapan la vista</b> y las <b>prisas</b> aumentan el riesgo.</p>"],["2. Medidas preventivas",UL(["<b>Camina sin correr</b>, mirando el recorrido; lleva cargas que te permitan ver el suelo.","<b>Limpia los derrames cuanto antes</b> y, mientras el suelo siga mojado, <b>delimita o señaliza</b> la zona y avisa al equipo.","Retira obstáculos; mantén cajones y puertas cerrados y evita que sobresalgan mesas, equipos o materiales en las zonas de paso.","Fija o cubre los cables que crucen zonas de paso con <b>pasacables</b>.","Pide <b>iluminación auxiliar</b> si la del evento es insuficiente (zonas de montaje, cocinas improvisadas, exteriores de noche)."])],["3. El calzado","<p>Usa el <b>calzado de trabajo antideslizante</b> previsto por la empresa, cerrado, bien sujeto al pie y con la suela en buen estado. Las zapatillas de suela lisa, las chanclas o los zapatos de tacón no son adecuados.</p>"+NOTE("Sustituye el calzado cuando la suela esté desgastada: pierde adherencia aunque por fuera parezca nuevo.")]],key:"Camina sin correr y con visibilidad, limpia y señaliza enseguida los derrames, retira obstáculos, cubre los cables y usa calzado antideslizante cerrado y en buen estado.",q:[["Se derrama una copa en el suelo durante el servicio. Lo correcto es:",["Limpiarla cuanto antes y señalizar la zona mientras siga mojada","Esperar al final del evento","Taparla con una servilleta y seguir","Avisar solo si alguien se cae"],0],["Una bandeja grande te tapa la visión del suelo:",["Reduces la carga o haces dos viajes para poder ver el recorrido","Caminas más rápido para terminar antes","Sigues igual, ya conoces el camino","Caminas hacia atrás"],0],["El calzado adecuado para el servicio es:",["Cerrado, antideslizante, sujeto al pie y con suela en buen estado","Zapatillas de suela lisa","Chanclas para estar cómodo","Zapatos de tacón para ir elegante"],0],["Los cables de un equipo cruzan una zona de paso:",["Se fijan o cubren con un pasacables, o se cambia su recorrido","Se dejan, la gente los verá","Se tapan con un mantel suelto","Se pasan por debajo de una alfombra arrugada"],0]]},
{t:"Caídas a distinto nivel: escaleras y alturas",ico:"🪜",min:5,src:"RD 486/1997; RD 1215/1997, anexo II (escaleras de mano)",obj:["Reconocer las situaciones de caída a distinto nivel en el servicio.","Usar escaleras de mano de forma segura.","No improvisar accesos con sillas, cajas o mesas."],b:[["1. Dónde aparece el riesgo",FIGI("assets/l08-alturas.webp","Trabajadora de cátering subida a una escalera de tijera estable para colocar un adorno, con una silla al lado sin usar","Para alcanzar una zona alta se usa un medio adecuado y estable, nunca una silla.")+UL(["Escaleras fijas al cargar material, sobre todo con las manos ocupadas.","Muelles de carga, tarimas, escenarios y desniveles sin protección.","Accesos improvisados para colgar decoración, alcanzar estanterías o cambiar una bombilla."])],["2. Medidas preventivas",UL(["Usa los <b>pasamanos</b>; no subas cargado si no puedes mantener el equilibrio y un apoyo seguro.","Para alcanzar zonas elevadas utiliza únicamente un <b>medio auxiliar adecuado, estable y autorizado</b> (escalera de tijera con tensor, taburete con peldaños). <b>Nunca sillas, cajas, mesas ni carros</b>.","Antes de subir, revisa la escalera: patas con zapatas, peldaños sanos, tensor colocado.","Sube y baja <b>de cara a la escalera</b>, con las manos libres; no te estires lateralmente: baja y desplázala.","No trabajes junto a huecos, bordes de tarimas o escenarios sin protección."])+ALERT("Los trabajos en altura que no sean puntuales y sencillos (decoración de techos, colgar estructuras) no forman parte de tu puesto: los hace personal especializado con los medios adecuados.")]],key:"Usa los pasamanos y no subas cargado sin un apoyo seguro. Para alcanzar zonas altas, solo escaleras o taburetes adecuados, estables y autorizados, nunca sillas, cajas o mesas. Sube de cara a la escalera y no trabajes junto a bordes sin protección.",q:[["Necesitas alcanzar un estante alto en el almacén del local:",["Usas una escalera o taburete adecuado y estable","Te subes a una silla","Te subes a una caja de bebidas","Te subes al carro de servicio"],0],["Al usar una escalera de tijera:",["Compruebas que el tensor está colocado y subes de cara a ella","Subes de espaldas","Te estiras hacia un lado para no moverla","La apoyas sobre una mesa para ganar altura"],0],["Subir una escalera fija cargando una caja que no te deja agarrarte:",["Debe evitarse: usa el pasamanos y lleva cargas que permitan apoyo seguro","Es lo normal","Se hace corriendo para tardar menos","Se hace de espaldas"],0],["Colgar una estructura de iluminación en el techo de la carpa:",["No es tu tarea: lo hace personal especializado con medios adecuados","Lo haces subiendo a una mesa","Lo hacen dos camareros con una silla","Lo hace quien esté libre"],0]]},
{t:"Caída de objetos, golpes y atrapamientos",ico:"📦",min:6,src:"RD 486/1997; RD 1215/1997; manual de prevención del puesto",obj:["Evitar la caída de bandejas, cajas, isotermos y menaje.","Apilar y almacenar de forma estable.","Montar y recoger mesas plegables sin atraparte los dedos."],b:[["1. Agarre y transporte",FIGI("assets/l09-objetos.webp","Dos trabajadores de cátering desplegando una mesa plegable con las manos lejos de las bisagras","Mesas desplegadas sobre suelo firme, con los bloqueos comprobados y los dedos fuera de los puntos de cierre.")+UL(["Revisa <b>asas, cierres, tapas y base</b> de los recipientes. No transportes cajas rotas, húmedas o deformadas.","Agarra con <b>toda la mano</b> y con las manos secas. Reduce la carga de la bandeja y reparte el peso de forma equilibrada.","No intentes recoger un objeto que cae, sobre todo si es de vidrio o cortante: apártate."])],["2. Apilar y almacenar",UL(["Coloca los elementos pesados <b>abajo</b> y lejos de los bordes.","No apiles por encima de una altura estable ni apoyes materiales en salidas o pasillos.","En la furgoneta y en los carros, sujeta la carga para que no se desplace."])],["3. Mesas, tapas y puertas",UL(["Despliega las mesas plegables sobre <b>suelo firme</b>, entre dos personas si son grandes, y <b>comprueba los bloqueos</b> de las patas antes de cargarlas.","Mantén los dedos fuera de <b>bisagras y puntos de cierre</b> de mesas, tapas de isotermos, puertas de hornos y carros.","Cierra las tapas acompañándolas, sin soltarlas de golpe."])+CASO("La mesa que se pliega","Durante el montaje, una mesa con una pata mal bloqueada se pliega al poner encima las bandejas.","Antes de cargar una mesa se comprueban todos los bloqueos y que apoya en suelo firme. La mesa defectuosa se retira y se comunica.")]],key:"Revisa asas y cierres, agarra con toda la mano y no sobrecargues las bandejas; apila lo pesado abajo y de forma estable; despliega las mesas sobre suelo firme, comprueba los bloqueos y mantén los dedos fuera de bisagras y cierres.",q:[["Una caja de cartón está húmeda y deformada:",["No la transportas así; cambias el contenido a otro recipiente","La llevas con cuidado","La apilas debajo de otras","La lanzas al carro"],0],["Al apilar material en el almacén o en el carro:",["Lo pesado va abajo y lejos de los bordes","Lo pesado va arriba","Se apila lo más alto posible","Se apoya en la salida de emergencia"],0],["Antes de poner bandejas sobre una mesa plegable:",["Compruebas que apoya en suelo firme y que los bloqueos de las patas están puestos","Le das un golpe para ver si aguanta","No hace falta comprobar nada","Le pones un mantel y listo"],0],["Se te cae un vaso de cristal de la mano:",["Te apartas y no intentas cogerlo al vuelo","Intentas atraparlo con la mano","Le das una patada para frenarlo","Lo coges cuando rebote"],0]]}
]};
const M4={t:"Cortes: cuchillos, máquinas y vidrio",fmin:3,s:"Uso seguro de cuchillos, máquinas de cocina con cuchillas y recogida de vidrio y vajilla rota.",L:[
{t:"Cuchillos y utensilios de corte",ico:"🔪",min:6,src:"RD 1215/1997; manual de prevención del puesto",obj:["Cortar de forma segura con cuchillos y utensilios.","Guardar, transportar y limpiar los cuchillos sin riesgo.","Saber cuándo usar guantes anticorte."],b:[["1. Al cortar",FIGI("assets/l10-cuchillos.webp","Trabajadora de cátering cortando pan sobre una tabla estable con un tapete antideslizante","Utensilio adecuado, superficie estable y la mano de apoyo fuera de la trayectoria del filo.")+UL(["Usa el <b>cuchillo adecuado</b> a cada tarea, bien afilado y con el mango en buen estado: un cuchillo sin filo obliga a hacer más fuerza y resbala.","Corta sobre una <b>tabla estable</b> (con un paño húmedo o tapete antideslizante debajo).","Corta <b>alejando el filo</b> del cuerpo y de la mano de apoyo, con los dedos recogidos.","No uses los cuchillos como abrelatas, destornillador o palanca."])],["2. Guardar, transportar y limpiar",UL(["Guarda y transporta los cuchillos <b>protegidos</b>: en su funda, en un estuche o en un portacuchillos.","No dejes cuchillos <b>ocultos</b> bajo manteles o servilletas, ni dentro del agua de lavado o del fregadero.","Lávalos uno a uno, con el filo hacia fuera, y no los mezcles con otro menaje.","Si se cae un cuchillo, <b>no intentes cogerlo al vuelo</b>."])],["3. Protección","<p>Para tareas de corte intensivo (deshuesar, cortar grandes piezas) o con riesgo elevado, la empresa puede indicar el uso de <b>guantes anticorte</b> (por ejemplo, de malla) en la mano que no lleva el cuchillo.</p>"+NOTE("Un guante desechable de higiene <b>no protege</b> frente a los cortes. Si sufres un corte, lávalo, cúbrelo con un apósito y comunícalo; si es profundo o sangra mucho, presiona y pide asistencia.")]],key:"Cuchillo adecuado y afilado, tabla estable, filo alejado del cuerpo y dedos recogidos. Guarda y transporta los cuchillos protegidos, nunca ocultos bajo manteles o en el agua, y no intentes coger uno que cae.",q:[["Al cortar con un cuchillo:",["El filo se aleja del cuerpo y de la mano de apoyo, con los dedos recogidos","Se corta hacia el cuerpo para más control","Se corta sobre la mano","Se sujeta el alimento con los dedos estirados"],0],["Un cuchillo sin filo:",["Es más peligroso porque obliga a hacer más fuerza y resbala","Es más seguro","Es igual de seguro","Solo es un problema estético"],0],["Dónde NO debe dejarse nunca un cuchillo:",["Dentro del agua del fregadero o bajo un mantel","En su funda","En el portacuchillos","En el estuche de transporte"],0],["Un guante desechable de vinilo o nitrilo:",["No protege frente a los cortes","Protege frente a cortes de cuchillo","Sustituye al guante de malla","Protege frente a quemaduras"],0]]},
{t:"Máquinas de cocina: cortafiambres, batidoras y picadoras",ico:"⚙️",min:6,src:"RD 1215/1997; instrucciones del fabricante",obj:["Usar las máquinas de cocina con sus resguardos.","Limpiarlas con la máquina parada y desconectada.","No anular nunca los dispositivos de seguridad."],b:[["1. Uso seguro",FIGI("assets/l11-maquinas.webp","Trabajadora de cátering usando una cortadora de fiambre con el resguardo y el empujador, con guante de malla","El resguardo y el empujador no son opcionales: son los que mantienen los dedos lejos de la cuchilla.")+UL(["Usa solo las máquinas para las que has recibido <b>instrucciones y autorización</b>, siguiendo el manual del fabricante.","Utiliza el <b>empujador</b> y mantén los <b>resguardos</b> colocados. Nunca acerques los dedos a la cuchilla.","Mantén el pelo recogido, la ropa ajustada y sin pulseras, anillos o colgantes que puedan engancharse.","No introduzcas las manos ni utensilios en una batidora, picadora o amasadora en marcha."])],["2. Limpieza y averías",UL(["Para limpiar o desmontar: <b>para la máquina, desconéctala de la corriente</b> y espera a que se detengan las partes móviles.","Limpia las cuchillas con guantes anticorte y utensilios, nunca pasando el trapo a lo largo del filo con la mano.","Si la máquina hace ruidos o vibraciones anormales, falla un interruptor o un resguardo, <b>deja de usarla</b> y comunícalo."])+ALERT("Está prohibido <b>retirar o anular resguardos y dispositivos de seguridad</b> (art. 29 LPRL). Las reparaciones las hace personal técnico autorizado.")]],key:"Solo máquinas para las que tienes formación y autorización; resguardos colocados y empujador siempre; pelo recogido y sin joyas. Para limpiar, máquina parada y desconectada. No anules nunca un dispositivo de seguridad y comunica las averías.",q:[["Para cortar fiambre con la cortadora:",["Usas el empujador y mantienes el resguardo colocado","Empujas la pieza con la mano hasta el final","Retiras el resguardo para ir más rápido","Lo haces con la mano mojada"],0],["Antes de limpiar una picadora o una cortadora:",["La paras y la desconectas de la corriente","Basta con apagarla un momento","La limpias en marcha para que sea más fácil","La mojas con la manguera"],0],["Al trabajar con máquinas de cocina conviene:",["Llevar el pelo recogido y no llevar pulseras ni anillos","Llevar ropa holgada","Llevar colgantes largos","Llevar guantes de lana"],0],["El interruptor de seguridad de la tapa de la batidora industrial no funciona:",["Dejas de usarla y lo comunicas","La usas sujetando la tapa","Lo puenteas con cinta","La usas solo un momento"],0]]},
{t:"Vidrio y vajilla rota",ico:"🥂",min:5,src:"Manual de prevención del puesto; RD 773/1997",obj:["Retirar del servicio la vajilla y el cristal dañados.","Recoger el vidrio roto sin usar las manos.","Desechar los fragmentos en un recipiente rígido."],b:[["1. Prevenir",FIGI("assets/l12-vidrio.webp","Trabajadora de cátering recogiendo cristales rotos con cepillo y recogedor y echándolos en un recipiente rígido","Cepillo y recogedor o pinzas, nunca las manos; y un recipiente rígido para los fragmentos.")+UL(["Retira del servicio las piezas de vajilla o cristal <b>agrietadas o desportilladas</b>.","No amontones copas ni vasos unos dentro de otros; usa las cestas o bandejas previstas.","No introduzcas la mano a ciegas en barreños, fregaderos o bolsas donde pueda haber vidrio."])],["2. Si se rompe un vaso",OL(["<b>Impide el paso</b> por la zona y avisa.","Recoge los fragmentos con <b>cepillo y recogedor o pinzas</b>; para los trozos pequeños, un papel húmedo.","Deposítalos en un <b>recipiente rígido</b> adecuado e identificado, no en la bolsa de basura normal.","No comprimas con las manos las bolsas de residuos."])+NOTE("Si hay riesgo de corte al manipular fragmentos grandes o el recipiente, usa <b>guantes de protección</b> adecuados frente al corte. Un guante desechable de higiene no protege frente al vidrio.")]],key:"Retira la vajilla dañada, no metas las manos a ciegas, impide el paso cuando algo se rompe y recoge el vidrio con cepillo, recogedor o pinzas en un recipiente rígido, nunca con las manos ni en la bolsa normal.",q:[["Se rompe una copa en el suelo de la sala:",["Impides el paso y recoges los fragmentos con cepillo y recogedor","Recoges los trozos con la mano","Los empujas debajo de una mesa","Los dejas para el final"],0],["Los fragmentos de vidrio se depositan:",["En un recipiente rígido e identificado","En la bolsa de basura normal","En el cubo de los restos de comida","En una servilleta de papel"],0],["Una copa tiene el borde desportillado:",["Se retira del servicio","Se sirve igualmente con cuidado","Se da a los invitados de confianza","Se usa para el personal"],0],["Para comprimir una bolsa de basura llena:",["No se comprime con las manos ni con el pie; se cierra y se cambia","Se aprieta con las manos","Se pisa con fuerza","Se sienta uno encima"],0]]}
]};
const M5={t:"Calor: quemaduras y equipos de cocina y servicio",fmin:3,s:"Hornos, freidoras, marmitas, vapor, líquidos calientes, chafing dishes, cafetera, lavavajillas y microondas.",L:[
{t:"Hornos, freidoras, marmitas y planchas",ico:"🔥",min:7,src:"RD 1215/1997; RD 486/1997; manual de prevención del puesto",obj:["Manipular recipientes calientes con las protecciones adecuadas.","Usar la freidora sin riesgo de quemaduras ni incendio.","Saber actuar si arde el aceite."],b:[["1. Hornos y bandejas",FIGI("assets/l13-hornos.webp","Cocinera de cátering con guantes térmicos largos sacando una bandeja caliente de un horno mixto","Guantes térmicos secos, cara apartada del vapor y la bandeja bien sujeta.")+UL(["Usa <b>guantes térmicos</b> adecuados, secos y en buen estado; un trapo húmedo transmite el calor y quema.","Abre la puerta del horno <b>dejando salir primero el vapor</b>, apartando la cara.","Sujeta las bandejas con las dos manos y no las llenes hasta el borde con líquidos calientes.","Ten preparado el lugar donde vas a dejar la bandeja <b>antes</b> de sacarla."])],["2. Freidoras",UL(["Mantén el nivel de aceite entre las marcas y <b>no introduzcas alimentos mojados o con hielo</b>: el agua hace que el aceite salte.","Baja la cesta despacio; no te inclines sobre la freidora.","No muevas una freidora con aceite caliente: espera a que se enfríe.","Cambia el aceite según las instrucciones; el aceite muy usado se inflama con más facilidad."])+ALERT("Si se incendia el aceite: <b>nunca eches agua</b>. Cierra el gas o desconecta la freidora si puedes, tapa el recipiente con su tapa o una manta ignífuga y, si se domina, usa un extintor adecuado (clase F) solo si has recibido formación. Si no se controla, sal y avisa.")],["3. Marmitas, ollas y planchas",UL(["Llena las ollas y marmitas sin superar su capacidad y <b>vuelca las marmitas con su mecanismo</b>, despacio, sin forzar.","Coloca los mangos de los recipientes hacia dentro, sin que sobresalgan del borde.","No toques las planchas o fogones para comprobar si están calientes; da por hecho que lo están."])]],key:"Guantes térmicos secos, abre el horno dejando salir el vapor y apartando la cara. En la freidora, nada mojado, cesta despacio y nunca agua si arde el aceite: tapa, corta la energía y avisa. Marmitas sin sobrellenar y mangos hacia dentro.",q:[["Para sacar una bandeja del horno utilizas:",["Guantes térmicos secos y en buen estado","Un trapo húmedo","Las manos si vas rápido","Servilletas de papel"],0],["Introducir alimentos mojados o con hielo en la freidora:",["Debe evitarse porque el aceite salta y puede quemarte","Mejora la fritura","Es indiferente","Enfría el aceite y es más seguro"],0],["Se prende el aceite de una freidora. Lo correcto es:",["Cortar la energía si es posible, tapar y no echar nunca agua","Echar un vaso de agua","Moverla corriendo al exterior","Soplar el fuego"],0],["Los mangos de ollas y sartenes deben colocarse:",["Hacia dentro, sin sobresalir del borde","Hacia fuera para cogerlos mejor","Encima de otro fuego","Da igual"],0]]},
{t:"Vapor, líquidos calientes, termos y chafing dishes",ico:"♨️",min:6,src:"Manual de prevención del puesto; RD 773/1997",obj:["Transportar líquidos y recipientes calientes sin derramarlos.","Abrir tapas y recipientes sin exponerte al vapor.","Usar con seguridad los calientaplatos y chafing dishes con combustible."],b:[["1. Transporte y servicio",FIGI("assets/l14-chafing.webp","Trabajadora de cátering levantando la tapa de un chafing dish con el vapor alejado de la cara y guante térmico","Un recipiente puede estar muy caliente aunque su aspecto no lo indique.")+UL(["Comprueba <b>cierres y estabilidad</b> de termos e isotermos. No llenes en exceso termos, jarras o tazas y evita trayectos largos con líquidos abiertos.","<b>Avisa</b> al pasar con productos calientes («¡caliente, paso!»), mantén distancia con las personas y no sirvas por encima de sus cabezas.","Abre las tapas <b>lentamente</b>, orientando la salida del vapor lejos de la cara y las manos."])],["2. Chafing dishes y calientaplatos",UL(["Colócalos sobre una <b>superficie estable</b> y nivelada, lejos de manteles que cuelguen, decoraciones, cortinas y del paso de los invitados.","Si usan <b>combustible (gel o mecha)</b>: enciéndelo con un encendedor largo, no lo rellenes nunca mientras esté encendido o caliente y apágalo con su tapa.","Rellena el agua del baño maría con precaución: puede estar hirviendo.","Al recoger, <b>deja enfriar</b> antes de manipular y no vacíes el agua caliente cerca de las personas."])+ALERT("La llama del combustible de gel es casi <b>invisible a la luz del día</b>. Nunca acerques la mano para comprobar si está encendido.")],["3. Si ocurre una quemadura",UL(["Interrumpe la exposición y pide ayuda.","Enfría con <b>agua corriente fresca durante unos minutos</b>, sin hielo, cremas ni remedios caseros.","No arranques la ropa pegada ni revientes las ampollas.","Solicita asistencia según la gravedad y <b>comunica el accidente</b> aunque parezca leve."])]],key:"Termos cerrados y sin sobrellenar, aviso al pasar con calientes, tapas abiertas despacio y vapor lejos de la cara. Chafing dishes estables, lejos de manteles y decoración; el combustible no se rellena encendido. Quemadura: agua fresca, sin hielo ni cremas, y comunicarlo.",q:[["Al abrir la tapa de un chafing dish caliente:",["La levantas despacio dirigiendo el vapor lejos de la cara","La levantas de golpe hacia ti","Acercas la cara para ver si está hecho","La quitas con la mano sin protección"],0],["El combustible de gel de un calientaplatos:",["No se rellena nunca mientras está encendido o caliente","Se rellena en marcha para no apagar","Se aviva con alcohol","Se apaga soplando"],0],["Para comprobar si el combustible de gel está encendido:",["Se observa con cuidado, sin acercar la mano, porque la llama apenas se ve de día","Se acerca la mano a la llama","Se toca el recipiente","Se echa un poco más de gel"],0],["Primer auxilio ante una quemadura leve:",["Agua corriente fresca durante unos minutos, sin hielo ni cremas","Hielo directo","Mantequilla o pasta de dientes","Reventar las ampollas"],0]]},
{t:"Cafetera, lavavajillas y microondas",ico:"☕",min:6,src:"RD 1215/1997; instrucciones del fabricante",obj:["Usar la cafetera sin exponerte al vapor ni a la presión.","Respetar los ciclos y enclavamientos del lavavajillas.","Calentar en el microondas sin quemaduras por contenidos sobrecalentados."],b:[["1. Cafetera",FIGI("assets/l15-cafetera.webp","Trabajadora de cátering usando una cafetera profesional junto a un lavavajillas de capota y un microondas","Manos y cara lejos de las salidas de agua y vapor.")+UL(["Comprueba su estabilidad y el estado de los mandos.","Mantén manos y cara <b>lejos de las salidas de agua y vapor</b>; purga la lanza de vapor apuntando hacia la bandeja.","No retires el portafiltro durante la extracción ni mientras haya presión.","No abras depósitos ni circuitos presurizados ni ajustes válvulas: el mantenimiento lo hace personal competente. Ante fugas, ruidos o presión anormales, detén el equipo y avisa."])],["2. Lavavajillas",UL(["Usa cestas adecuadas, sin sobrecargarlas; identifica los <b>utensilios cortantes</b> antes de meter las manos y desecha las piezas rotas.","Respeta los ciclos y los <b>enclavamientos</b>: no abras durante el funcionamiento y deja disipar el vapor antes de acercarte.","Espera antes de coger piezas calientes y mantén el suelo seco.","Manipula detergentes y abrillantadores según la etiqueta, con guantes y gafas si se indican; no intervengas en los dosificadores si no estás autorizado."])],["3. Microondas",UL(["Usa recipientes y tapas aptos; <b>no introduzcas metales</b> ni calientes envases cerrados herméticamente.","No lo pongas en marcha vacío ni lo uses con la puerta, las juntas o las bisagras dañadas.","Respeta los tiempos de calentamiento y reposo: el contenido puede estar <b>más caliente que el recipiente</b> y salpicar al abrir o remover.","Las personas con dispositivos médicos implantados deben seguir las indicaciones de su personal sanitario y del fabricante."])]],key:"Cafetera: manos y cara lejos del vapor y sin manipular partes a presión. Lavavajillas: respeta ciclos y enclavamientos, deja salir el vapor y vigila los cortantes. Microondas: sin metales ni envases cerrados, y cuidado con el contenido sobrecalentado.",q:[["Al usar la lanza de vapor de la cafetera:",["Mantienes la cara y las manos lejos de la salida del vapor","Acercas la cara para ver la espuma","Tocas la lanza para comprobar la temperatura","Retiras el portafiltro durante la extracción"],0],["El lavavajillas está en mitad del ciclo y necesitas un vaso:",["Esperas a que termine y a que salga el vapor","Lo abres un momento","Fuerzas el enclavamiento","Metes la mano rápidamente"],0],["En el microondas NO se debe:",["Calentar envases cerrados herméticamente ni introducir metales","Usar recipientes aptos","Respetar el tiempo de reposo","Destapar con cuidado"],0],["La cafetera pierde agua y hace un ruido anormal de presión:",["La detienes y avisas; no ajustas válvulas","Ajustas tú la válvula de seguridad","Sigues sirviendo cafés","La golpeas para que pare"],0]]}
]};
const M6={t:"Electricidad, gas y gases a presión",fmin:3,s:"Equipos eléctricos y alargadores en eventos, bombonas de GLP y equipos de cerveza con CO₂.",L:[
{t:"Riesgo eléctrico en el montaje y el servicio",ico:"⚡",min:6,src:"RD 614/2001; REBT (RD 842/2002)",obj:["Revisar visualmente cables, clavijas y equipos antes de conectarlos.","Conectar sin sobrecargas, empalmes ni adaptadores en cadena.","Saber actuar ante un equipo dañado o una descarga."],b:[["1. Antes de conectar",FIGI("assets/l16-electrico.webp","Trabajadora de cátering revisando con las manos secas el cable de un alargador antes de conectar la cafetera, con pasacables en el suelo","Una revisión visual de unos segundos evita la mayoría de los contactos eléctricos.")+UL(["Revisa visualmente <b>cables, clavijas, carcasas y mandos</b> de cafetera, microondas, calientaplatos, lavavajillas, tirador o alargadores.","No uses equipos con <b>cables pelados, clavijas rotas, carcasas dañadas o señales de humedad</b>: retíralos, comunícalo y evita que otra persona los use.","Comprueba que el lugar de apoyo es <b>estable y seco</b> y que el punto de suministro es adecuado para el equipo.","Manipula enchufes y aparatos con las <b>manos secas</b>; mantén cables y conexiones lejos del agua, del calor y de las zonas de paso."])],["2. Conexiones seguras",UL(["No hagas <b>empalmes improvisados</b> ni introduzcas cables desnudos en los enchufes. No anules la toma de tierra.","No conectes <b>adaptadores o regletas en cadena</b> ni sobrecargues una toma con varios equipos de calor. Si faltan tomas seguras, pide una solución al responsable.","Los alargadores deben ser adecuados al equipo y al entorno (en exterior, aptos para intemperie) y estar <b>totalmente desenrollados</b> si alimentan equipos de potencia.","Desconecta tirando de la clavija, nunca del cable. No abras cuadros ni carcasas."])+NOTE("El personal de servicio no realiza verificaciones eléctricas técnicas ni reparaciones: eso corresponde a personal autorizado.")],["3. Si algo falla",ALERT("Ante chispas, olor a quemado, descargas o calentamiento anormal: <b>deja de usar el equipo</b>, desconéctalo solo si puedes hacerlo sin exponerte, aísla la zona y avisa. No rearmes una y otra vez un diferencial que salta.")+UL(["Si una persona está recibiendo una descarga, <b>no la toques</b> mientras pueda seguir en contacto con la corriente. Corta el suministro solo si puedes hacerlo con seguridad y llama al 112.","Con lluvia o suelo encharcado, no manipules equipos ni conexiones mojados."])]],key:"Revisión visual antes de conectar, manos secas, nada de empalmes, adaptadores en cadena ni sobrecargas, alargadores adecuados y desenrollados. Ante chispas, olor a quemado o descargas, deja de usar el equipo, aísla y avisa. Nunca toques a una persona electrocutada sin cortar la corriente.",q:[["Antes de enchufar la cafetera en un evento conviene:",["Revisar visualmente cable, clavija y carcasa y comprobar que el apoyo está seco","Enchufarla con las manos mojadas","Conectarla a una regleta conectada a otra regleta","Quitarle la toma de tierra"],0],["El diferencial salta cada vez que conectas el calientaplatos:",["Dejas de usarlo, no lo rearmas repetidamente y avisas","Lo rearmas hasta que aguante","Lo conectas a otra toma sin decir nada","Puenteas el diferencial"],0],["Un alargador de bobina que alimenta un equipo de potencia:",["Debe estar totalmente desenrollado","Debe quedar enrollado para que no estorbe","Da igual cómo esté","Se tapa con un mantel"],0],["Un compañero está en contacto con un cable en tensión. Lo primero es:",["No tocarlo y cortar la corriente si puedes hacerlo con seguridad","Tirar de él con las manos","Echarle agua","Esperar a que se suelte solo"],0]]},
{t:"Gas (GLP): bombonas y equipos de cocina",ico:"🔥",min:6,src:"RD 919/2006 (combustibles gaseosos); instrucciones del fabricante",obj:["Manipular y colocar las bombonas de butano o propano de forma segura.","Revisar la conexión y la manguera antes de encender.","Saber actuar ante olor a gas o una fuga."],b:[["1. Bombonas y conexiones",FIGI("assets/l17-gas.webp","Trabajador de cátering revisando la manguera de una bombona de gas vertical conectada a un quemador de paellas en una carpa","Bombona vertical, sujeta, ventilada y lejos del calor; manguera en buen estado y dentro de su fecha.")+"<p>En eventos al aire libre y cocinas de campaña se usan con frecuencia <b>gases licuados del petróleo (GLP)</b>: butano y propano. Son más pesados que el aire y se acumulan en zonas bajas y cerradas.</p>"+UL(["Coloca las bombonas <b>siempre de pie</b>, estables, en un lugar <b>ventilado</b>, protegidas del sol y alejadas de fuentes de calor, de los fuegos y del paso del público.","Transpórtalas en un carro, sujetas; no las arrastres, hagas rodar ni las levantes por la válvula.","Revisa visualmente el <b>regulador, la manguera</b> (sin grietas, bien fijada con abrazaderas y dentro de su fecha de caducidad) y las conexiones.","El montaje y los cambios de bombona los hace solo <b>personal instruido y autorizado</b>, siguiendo las instrucciones del fabricante."])],["2. Encendido y uso",UL(["Enciende siguiendo el orden del fabricante: primero la llama o el encendedor, después abre el gas.","No dejes los quemadores encendidos sin vigilancia; mantén alejados manteles, cajas de cartón y decoración.","Al terminar, <b>cierra la llave de la bombona</b> y luego los mandos del aparato.","Nunca uses equipos de gas en espacios cerrados sin la ventilación prevista."])],["3. Ante olor a gas o una fuga",ALERT("<b>No busques nunca una fuga con una llama.</b> No enciendas ni apagues interruptores, no uses el móvil junto a la zona, cierra la válvula si puedes hacerlo sin exponerte, ventila, aleja a las personas y avisa. Si la fuga no se controla o hay alguien afectado, evacua y llama al 112.")+NOTE("Para comprobar si hay fugas se usa agua jabonosa en las conexiones, nunca una llama. Si una manguera está dañada o caducada, el equipo no se usa hasta sustituirla.")]],key:"Bombonas de pie, sujetas, ventiladas y lejos del calor; manguera y regulador revisados; cambios solo por personal autorizado. Al terminar, cierra la bombona. Ante olor a gas: sin llamas ni interruptores, cierra si es seguro, ventila, aleja a la gente y avisa.",q:[["Una bombona de butano o propano debe colocarse:",["De pie, estable, en un lugar ventilado y alejada del calor","Tumbada para que no se caiga","Junto al quemador para que llegue la manguera","En un cuarto cerrado para protegerla"],0],["Para buscar una posible fuga de gas en una conexión:",["Se usa agua jabonosa, nunca una llama","Se acerca un mechero","Se huele pegando la nariz","Se golpea la conexión"],0],["Notas olor a gas en la cocina de campaña:",["No enciendes nada, cierras la válvula si es seguro, ventilas y avisas","Enciendes la luz para ver mejor","Buscas la fuga con el mechero","Sigues cocinando"],0],["El GLP (butano y propano) es más pesado que el aire, por eso:",["Se acumula en zonas bajas y cerradas","Se dispersa enseguida hacia arriba","No es peligroso en interiores","No arde"],0]]},
{t:"Tirador de cerveza, barriles y botellas de CO₂",ico:"🍺",min:5,src:"RD 2060/2008 (equipos a presión); instrucciones del fabricante",obj:["Manipular barriles y botellas de gas a presión sin riesgos.","No improvisar conexiones ni ajustar presiones.","Actuar ante una posible fuga de CO₂."],b:[["1. Riesgos principales",FIGI("assets/l18-cerveza.webp","Trabajadora de cátering tirando una cerveza; debajo de la barra, un barril y una botella de CO₂ vertical sujeta con cadena","La botella de CO₂ siempre vertical, sujeta y en un lugar ventilado.")+UL(["Los <b>barriles</b> pesan mucho: pueden provocar sobreesfuerzos o atrapamientos. Muévelos con carro o entre dos personas.","Las <b>conexiones a presión</b> pueden producir proyecciones; las botellas pueden caer o dañarse.","Una fuga de <b>dióxido de carbono (CO₂)</b> en un lugar poco ventilado (sótano, cuarto cerrado, bajo una barra cerrada) puede crear una atmósfera peligrosa <b>sin olor que avise</b>."])],["2. Instalación y uso",UL(["El montaje y los cambios de botella o barril los hace solo <b>personal instruido y autorizado</b>. No improvises conexiones ni ajustes presiones.","Mantén las botellas <b>verticales, sujetas contra el vuelco</b> y en un lugar ventilado, protegidas de golpes, calor y sol directo.","Transporta las botellas con un carro y sujetas; no las arrastres ni las levantes por la válvula o el capuchón.","No aflojes componentes que puedan estar presurizados y cierra el suministro al terminar si así lo indican las instrucciones."])+ALERT("Ante una posible fuga: deja de usar el equipo, aleja a las personas y avisa. Cierra la válvula solo si puedes hacerlo sin exponerte. <b>No entres</b> en sótanos o cuartos cerrados donde se haya podido acumular el gas, ni siquiera para rescatar a alguien: llama al 112.")]],key:"Barriles con carro o entre dos; botellas de CO₂ verticales, sujetas, ventiladas y protegidas; cambios y conexiones solo por personal autorizado. El CO₂ no huele: ante una fuga, aleja a la gente, avisa y no entres en espacios cerrados.",q:[["La botella de CO₂ del tirador debe estar:",["Vertical, sujeta contra el vuelco y en un lugar ventilado","Tumbada en el suelo","Junto a una fuente de calor","En un cuarto cerrado sin ventilación"],0],["¿Por qué es peligrosa una fuga de CO₂ en un sótano?",["Puede crear una atmósfera peligrosa sin olor que avise","Porque huele muy mal","Porque es inflamable como el butano","No es peligrosa"],0],["Un compañero se ha desmayado en el cuarto cerrado donde están las botellas de CO₂:",["No entras; alejas a los demás, avisas y llamas al 112","Entras corriendo a sacarlo","Entras con un pañuelo en la boca","Esperas a que se despierte"],0],["El cambio de una botella de CO₂ o de un barril lo hace:",["Solo personal instruido y autorizado","Cualquier camarero que esté libre","Un invitado que sepa","Nadie, se deja como está"],0]]}
]};
const M7={t:"Carga física: cargas, carros, montaje y posturas",fmin:4,s:"Manipulación de cargas, uso de carros, montaje y desmontaje de mesas y carpas y trabajo prolongado de pie.",L:[
{t:"Manipulación manual de cargas",ico:"📦",min:7,src:"RD 487/1997; Guía técnica del INSST sobre manipulación manual de cargas",obj:["Priorizar las ayudas mecánicas frente al levantamiento manual.","Levantar una carga manejable con la técnica correcta.","Saber cuándo detenerse y pedir ayuda."],b:[["1. Dónde aparece el riesgo",FIGI("assets/l19-cargas.webp","Trabajador de cátering levantando una caja de bebidas con la carga pegada al cuerpo en un almacén, con una carretilla al lado","La carga, pegada al cuerpo; y siempre que se pueda, mejor la carretilla o el carro.")+"<p>Al mover cajas de bebidas, barriles, isotermos, pilas de platos, mesas o bolsas de residuos. También con cargas ligeras si se manipulan muchas veces, lejos del cuerpo, por escaleras o con posturas forzadas. El <b>RD 487/1997</b> obliga a la empresa a evitar la manipulación manual o, si no es posible, a reducir el riesgo.</p>"],["2. Prioridad a las ayudas",UL(["<b>Evita el levantamiento manual</b> siempre que sea posible: usa carros, carretillas, divide los bultos o pide una solución de transporte adecuada.","Para barriles, cajas pesadas y materiales voluminosos <b>no improvises</b> un levantamiento individual. Si hace falta hacerlo entre varias personas, se organiza y se coordina (una persona da las órdenes).","Respeta las restricciones individuales y <b>no uses la fuerza para compensar la falta de medios</b>."])+NOTE("La cifra de <b>25 kg</b> que aparece en la guía técnica es una referencia en condiciones ideales, <b>no garantiza</b> una manipulación segura ni es un límite universal: depende de la frecuencia, el agarre, la postura, el recorrido y las características de cada persona.")],["3. Cómo levantar una carga manejable",OL(["Comprueba el peso, el contenido, los agarres y dónde la vas a dejar. <b>Despeja el recorrido</b>.","Acércate, separa los pies para tener una base estable y <b>flexiona las rodillas</b>, con la espalda recta.","Sujeta con ambas manos, <b>mantén la carga pegada al cuerpo</b> y levanta suavemente, sin tirones.","<b>Gira moviendo los pies</b>, sin torcer el tronco. Evita elevar la carga por encima de los hombros.","Deposítala sobre una superficie estable protegiendo los dedos. Mejor varios viajes con menos peso."])+ALERT("Si la carga se atasca, es inestable o exige un esfuerzo elevado, <b>detente y pide ayuda</b>. Una faja lumbar no sustituye a las ayudas mecánicas ni hace segura una carga excesiva.")]],key:"Primero ayudas mecánicas y dividir los bultos; las cargas pesadas no se levantan en solitario. Si la carga es manejable: acércate, rodillas flexionadas, espalda recta, carga pegada al cuerpo, sin tirones ni giros del tronco. Si cuesta, para y pide ayuda.",q:[["Hay que llevar seis cajas de bebidas hasta la barra:",["Usas un carro o carretilla en lugar de cargarlas a mano","Llevas tres cajas apiladas de golpe","Las arrastras por el suelo","Las lleva una sola persona corriendo"],0],["La cifra de 25 kg:",["Es una referencia, no garantiza una manipulación segura ni es un límite universal","Es un límite que siempre es seguro","Significa que por debajo de 25 kg no hay riesgo","Solo se aplica a mujeres"],0],["Al levantar una carga manejable:",["Flexionas las rodillas, espalda recta y carga pegada al cuerpo","Doblas la espalda con las piernas rectas","Levantas con los brazos estirados","Giras el tronco mientras levantas"],0],["Para girar con una caja en las manos:",["Mueves los pies, sin torcer el tronco","Giras la cintura","Lanzas la caja","Giras rápido para aprovechar el impulso"],0],["Una faja lumbar:",["No sustituye a las ayudas mecánicas ni hace segura una carga excesiva","Permite levantar cualquier peso","Es obligatoria en cátering","Sustituye a la técnica correcta"],0]]},
{t:"Carros, jaulas y transporte de material",ico:"🛒",min:5,src:"RD 1215/1997; manual de prevención del puesto",obj:["Revisar y cargar correctamente carros y jaulas.","Empujar y frenar sin sobreesfuerzos ni atrapamientos.","Retirar de uso los carros defectuosos."],b:[["1. Revisar y cargar",FIGI("assets/l20-carros.webp","Trabajador de cátering empujando un carro jaula con las dos manos, con los isotermos pesados abajo","Lo pesado abajo, la carga asegurada y por debajo de la altura de los ojos.")+UL(["Revisa <b>ruedas, asas, frenos, estabilidad</b> y la capacidad de carga indicada.","Reparte el peso con los objetos <b>más pesados abajo</b> y asegura tapas y materiales.","No superes la capacidad ni una altura que te impida <b>ver el recorrido</b>."])],["2. Empujar y frenar",UL(["<b>Empuja</b> (mejor que tirar) desde el asidero con ambas manos, a velocidad de paso y con la espalda en una posición cómoda.","Mantén los pies lejos de las ruedas y las manos lejos de los puntos de atrapamiento, sobre todo al pasar puertas.","No lleves personas sobre el carro ni lo sueltes en movimiento.","<b>Frena</b> al estacionar y durante la carga y descarga. Evita pendientes y escalones no previstos para ese carro."])+ALERT("Si el suelo, la pendiente o la carga dificultan controlar el carro, pide otra ruta o medios adecuados. <b>No intentes frenarlo con el cuerpo.</b> Retira de uso los carros con ruedas bloqueadas o frenos defectuosos y comunícalo.")]],key:"Revisa ruedas y frenos, lo pesado abajo y la carga por debajo de la vista. Empuja con las dos manos a paso normal, pies lejos de las ruedas, y frena al cargar o estacionar. En pendientes, pide ayuda o medios; nunca frenes un carro con el cuerpo.",q:[["Al cargar un carro de transporte:",["Lo pesado abajo y sin superar una altura que impida ver el recorrido","Lo pesado arriba","Lo más alto posible para hacer menos viajes","Sin sujetar las tapas"],0],["Es mejor:",["Empujar el carro con ambas manos que tirar de él","Tirar del carro con una
