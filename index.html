 mano","Correr con el carro","Soltarlo en las rampas"],0],["El carro empieza a coger velocidad en una rampa:",["No lo frenas con el cuerpo; se debe evitar la rampa o pedir ayuda y medios","Te pones delante para pararlo","Lo sueltas","Te subes encima"],0],["Un carro tiene una rueda bloqueada:",["Se retira de uso y se comunica","Se usa forzándolo","Se usa solo con carga ligera","Se le da una patada a la rueda"],0]]},
{t:"Montaje y desmontaje de eventos: mesas, carpas y estructuras",ico:"⛺",min:6,src:"RD 1215/1997; RD 487/1997; instrucciones del fabricante",obj:["Montar y desmontar mesas y carpas de forma coordinada.","Asegurar las estructuras frente al viento.","Saber cuándo suspender el montaje por meteorología."],b:[["1. Organizar el montaje",FIGI("assets/l21-montaje.webp","Equipo de cátering levantando una carpa plegable entre varias personas, con contrapesos en las patas","Las carpas se montan entre varias personas, coordinadas y con los contrapesos colocados.")+UL(["Sigue las <b>instrucciones del fabricante</b> y el orden de montaje previsto. Si no conoces el equipo, pide que te lo expliquen.","Las mesas grandes, tableros y carpas se manejan <b>entre dos o más personas</b>, con una que coordine los movimientos.","Usa <b>guantes</b> de trabajo cuando manipules estructuras metálicas con aristas o puntos de pellizco.","Mantén despejada la zona de montaje y apartados a los invitados o a otras personas."])],["2. Carpas y viento",UL(["Coloca y fija los <b>contrapesos o anclajes</b> en todas las patas antes de dejar la carpa montada.","Bloquea correctamente los mecanismos telescópicos; ojo con los dedos en los puntos de cierre.","No cuelgues cargas no previstas (iluminación, calefactores) de la estructura."])+ALERT("Con <b>viento intenso, tormenta o lluvia fuerte</b> informa y sigue las instrucciones de suspensión o refugio. <b>No intentes sujetar una estructura que se vuelca</b>: apártate.")],["3. Desmontaje",UL(["El desmontaje suele hacerse <b>al final de jornadas largas</b>, con cansancio y prisa: es cuando más accidentes se producen. Mantén el mismo cuidado que al montar.","Desmonta en el orden inverso, sin dejar elementos sueltos que puedan caer.","Apila y carga el material de forma estable y respeta los pesos de cada persona."])]],key:"Montaje según el fabricante, entre varias personas coordinadas y con guantes; carpas con contrapesos en todas las patas y bloqueos comprobados. Con viento o tormenta, se suspende: nunca sujetes una estructura que se vuelca. En el desmontaje, mismo cuidado aunque haya cansancio.",q:[["Una carpa plegable se monta:",["Entre varias personas coordinadas y con contrapesos en todas las patas","Por una sola persona para ir más rápido","Sin contrapesos si no hace viento al empezar","Colgándose de la estructura"],0],["Se levanta un viento fuerte y una carpa empieza a volcar:",["Te apartas y no intentas sujetarla","Te cuelgas de una pata para frenarla","Corres a sujetarla con los invitados","Te metes debajo"],0],["El desmontaje al final de la noche:",["Exige el mismo cuidado: el cansancio y la prisa aumentan los accidentes","Se puede hacer deprisa sin más","No tiene riesgos","Se hace sin guantes para ir más rápido"],0],["Colgar un calefactor de la estructura de la carpa sin estar previsto:",["No se hace: no se cuelgan cargas no previstas","Es una buena idea","Se hace si es ligero","Se hace con cinta adhesiva"],0]]},
{t:"Trabajo de pie, posturas y movimientos repetitivos",ico:"🧍",min:5,src:"RD 486/1997; Guía técnica del INSST sobre posturas de trabajo",obj:["Reducir la fatiga del trabajo prolongado de pie.","Evitar posturas forzadas al servir y reponer.","Aprovechar las pausas y comunicar molestias."],b:[["1. Por qué cansa",FIGI("assets/l22-pie.webp","Trabajadora de cátering sirviendo de pie con postura relajada, con un compañero sentado en un taburete durante su pausa","Alternar posturas, apoyar un pie y aprovechar las pausas para sentarse reduce la fatiga.")+"<p>Durante el montaje, la reposición y la atención al público se acumula fatiga en piernas, espalda, hombros y muñecas. Las superficies demasiado bajas o altas obligan a inclinarse o levantar los brazos, y repetir siempre el mismo gesto aumenta la sobrecarga.</p>"],["2. Medidas",UL(["Sitúa los materiales de uso frecuente <b>al alcance</b>, evitando estiramientos y giros repetidos.","<b>Acércate</b> al punto de servicio en lugar de servir con los brazos estirados. Reduce el peso de las bandejas y no las mantengas cargadas sin necesidad.","<b>Alterna tareas y posturas</b>; apoya un pie en un reposapiés o en un travesaño bajo.","Realiza <b>pausas de recuperación</b> y aprovecha las que te permitan sentarte; bebe agua.","Usa calzado cómodo, con buen apoyo y sujeción."])+NOTE("Comunica las <b>molestias persistentes</b> (dolor de espalda, de hombros, de muñecas, varices) y las necesidades de adaptación. La organización debe prever descansos y un reparto equilibrado del trabajo.")]],key:"Material al alcance, acércate al punto de servicio, bandejas con menos peso, alterna tareas y posturas, apoya un pie y aprovecha las pausas para sentarte. Comunica las molestias persistentes.",q:[["Para servir en una mesa alejada:",["Te acercas al punto de servicio en lugar de estirar los brazos","Te estiras al máximo sin mover los pies","Lanzas el plato","Te inclinas sobre los invitados"],0],["Una medida útil en el trabajo prolongado de pie es:",["Alternar posturas y apoyar un pie en un reposapiés o travesaño","Permanecer inmóvil en la misma postura","No hacer pausas","Llevar zapatos de tacón"],0],["Mantener una bandeja cargada mientras esperas:",["Debe evitarse: apóyala o reduce su peso","Es la forma correcta","Fortalece los brazos y es recomendable","Da igual"],0],["Si tienes dolor de espalda que no desaparece:",["Lo comunicas para valorar adaptaciones","Lo ocultas para no molestar","Tomas cualquier medicamento sin consultar","Trabajas más para olvidarlo"],0]]}
]};
const M8={t:"Ambiente térmico e higiene",fmin:3,s:"Cámaras frigoríficas, calor en cocina y en eventos al aire libre, e higiene frente a agentes biológicos.",L:[
{t:"Cámaras frigoríficas y trabajo con frío",ico:"❄️",min:5,src:"RD 486/1997, anexo III; RD 1215/1997",obj:["Entrar y trabajar en cámaras frigoríficas con seguridad.","Usar la ropa de protección frente al frío.","Comprobar los dispositivos de apertura interior."],b:[["1. Riesgos",FIGI("assets/l23-frio.webp","Trabajadora de cátering con chaqueta térmica y guantes en una cámara frigorífica, con la puerta abierta y el tirador de apertura interior","La cámara debe poder abrirse siempre desde dentro.")+UL(["Exposición a <b>bajas temperaturas</b> y cambios bruscos de temperatura al entrar y salir.","Quedarse <b>encerrado</b> si la puerta no se abre desde dentro.","Resbalones por hielo o condensación en el suelo y sobreesfuerzos al mover cajas pesadas."])],["2. Medidas",UL(["Antes de entrar, comprueba que el <b>dispositivo de apertura interior</b> y el pulsador de alarma funcionan y que la puerta no queda bloqueada.","Usa la <b>ropa de protección frente al frío</b> que facilite la empresa (chaqueta térmica, guantes) si vas a permanecer en el interior, sobre todo en cámaras de congelación.","Limita el tiempo de permanencia, sal a recuperarte y avisa a un compañero si vas a entrar en una cámara de congelación.","Mantén el suelo y las estanterías ordenados, sin hielo, y coloca lo pesado en las baldas medias.","Las cámaras y neveras portátiles de los eventos se cierran sin forzar los dedos en las juntas."])+ALERT("Si una puerta de cámara no abre desde dentro o falla la alarma, <b>no la uses</b> y comunícalo de inmediato.")]],key:"Antes de entrar en una cámara, comprueba la apertura interior y la alarma; usa ropa contra el frío, limita la permanencia y avisa si entras en congelación. Suelo sin hielo y lo pesado en baldas medias.",q:[["Antes de entrar en una cámara frigorífica:",["Compruebas que la puerta se abre desde dentro y que la alarma funciona","Cierras la puerta con llave","Bloqueas la puerta por fuera","No hace falta comprobar nada"],0],["Si vas a permanecer un rato en una cámara de congelación:",["Usas ropa térmica, limitas el tiempo y avisas a un compañero","Entras en manga corta para salir antes","Te quedas el tiempo que haga falta","Cierras la puerta para que no se escape el frío y no avisas"],0],["La apertura interior de la cámara no funciona:",["No la usas y lo comunicas de inmediato","Entras con la puerta entornada sin decir nada","Le pones una caja para que no se cierre y sigues","Lo dejas para otro día"],0],["Las cajas pesadas en la cámara se colocan:",["En las baldas medias","En las baldas más altas","En el suelo, en la zona de paso","Encima de la puerta"],0]]},
{t:"Estrés térmico: calor en cocina y eventos al aire libre",ico:"☀️",min:5,src:"RD 486/1997, anexo III; RDL 4/2023 (episodios de calor extremo)",obj:["Reconocer los síntomas del estrés térmico y del golpe de calor.","Aplicar medidas de hidratación, pausas y sombra.","Actuar ante una persona afectada por el calor."],b:[["1. Dónde aparece",FIGI("assets/l24-calor.webp","Dos trabajadores de cátering bebiendo agua a la sombra de una carpa durante un evento de verano","Agua a mano, pausas a la sombra y avisar a tiempo de cualquier síntoma.")+"<p>En cocinas con hornos, freidoras y planchas, y en <b>eventos al aire libre en verano</b> (bodas, comidas en jardines, eventos deportivos), el cuerpo puede no ser capaz de eliminar el calor. Influyen la temperatura, la humedad, el sol directo, el esfuerzo físico, la ropa y el tiempo de exposición.</p>"],["2. Medidas",UL(["<b>Bebe agua con frecuencia</b>, sin esperar a tener sed; evita el alcohol y las bebidas muy azucaradas.","Haz <b>pausas a la sombra</b> o en zonas frescas y alterna las tareas más expuestas.","Planifica los trabajos más pesados (montaje, carga) en las horas de menos calor cuando sea posible.","Usa ropa ligera y transpirable y protégete del sol (gorra, crema) cuando estés al aire libre.","La empresa debe adaptar la organización cuando haya avisos por <b>calor extremo</b>, incluida la reducción o suspensión de tareas."])],["3. Síntomas y actuación",UL(["Síntomas de alerta: <b>calambres, mareo, dolor de cabeza, náuseas, sudoración intensa, cansancio extremo</b>.","Golpe de calor: piel caliente, confusión, desmayo. Es una <b>urgencia</b>."])+ALERT("Ante síntomas, lleva a la persona a un lugar fresco, aflójale la ropa, refréscala con agua y dale de beber si está consciente. Si está confusa, se desmaya o no mejora, <b>llama al 112</b>.")]],key:"Agua frecuente sin esperar a la sed, pausas a la sombra, tareas pesadas en las horas frescas y ropa ligera. Mareo, calambres o náuseas son señales de alerta; confusión o desmayo, urgencia: lugar fresco, enfriar y 112.",q:[["Durante un montaje al aire libre en verano:",["Bebes agua con frecuencia sin esperar a tener sed y haces pausas a la sombra","Bebes solo al terminar","Trabajas al sol sin parar para acabar antes","Tomas bebidas alcohólicas para refrescarte"],0],["Un compañero está confuso, con la piel muy caliente y no suda:",["Puede ser un golpe de calor: lugar fresco, enfriarlo y llamar al 112","Le dices que siga trabajando","Le das una bebida alcohólica","Lo dejas al sol para que se recupere"],0],["Son síntomas de alerta por calor:",["Calambres, mareo, dolor de cabeza y náuseas","Hambre y sueño únicamente","Frío en las manos","Ninguno, el calor no da síntomas"],0],["Las tareas más pesadas del montaje, en un día muy caluroso:",["Se planifican, si es posible, en las horas de menos calor","Se hacen siempre al mediodía","Da igual la hora","Se hacen sin pausas"],0]]},
{t:"Higiene y riesgo biológico para el trabajador",ico:"🧼",min:5,src:"RD 664/1997; manual de prevención del puesto",obj:["Reconocer cuándo hay exposición a agentes biológicos en la recogida.","Aplicar la higiene de manos y la separación de material limpio y usado.","Actuar ante un corte, un pinchazo o fluidos."],b:[["1. Situaciones de exposición",FIGI("assets/l25-higiene.webp","Trabajadora de cátering lavándose las manos en un lavamanos, junto a un carro con el menaje usado separado del limpio","La higiene de manos y separar lo limpio de lo usado protegen al trabajador, no solo al cliente.")+"<p>Durante la recogida se manipulan vasos, cubiertos, servilletas y residuos usados que pueden contener <b>saliva u otros fluidos</b>. Las heridas, tocarse ojos o boca con las manos sucias y manipular objetos cortantes favorecen la exposición.</p>"+NOTE("La formación de manipulador de alimentos protege al consumidor y es complementaria. Aquí nos centramos en tu protección como trabajador.")],["2. Medidas",UL(["<b>Lávate las manos</b> después de recoger menaje sucio o residuos, tras quitarte los guantes y antes de comer; evita tocarte la cara.","Separa el material <b>limpio del usado</b>.","Cubre las heridas de las manos con apósitos impermeables.","<b>No introduzcas la mano</b> en bolsas o recipientes sin ver su contenido.","Ante <b>sangre, vómitos</b> u otros fluidos: delimita la zona y avisa para aplicar el procedimiento y las protecciones previstos (guantes, material desechable, desinfectante)."])+ALERT("Los guantes <b>no sustituyen</b> la higiene de manos. Ante un corte, un pinchazo o una salpicadura en ojos o boca: lava la zona, comunícalo como accidente y solicita valoración sanitaria. Lo que corresponda hacer después lo decide el <b>personal sanitario</b>.")]],key:"Lávate las manos tras recoger y al quitarte los guantes, separa lo limpio de lo usado, cubre las heridas y no metas la mano en bolsas sin ver. Ante fluidos, delimita y avisa. Un corte o pinchazo con material usado se lava, se comunica y lo valora el personal sanitario.",q:[["Después de recoger el menaje usado de las mesas:",["Te lavas las manos","Te tocas la cara","Pasas directamente a servir el postre sin lavarte","Basta con limpiarte en el delantal"],0],["Los guantes desechables:",["No sustituyen la higiene de manos","Sustituyen el lavado de manos","Se reutilizan todo el día","Se lavan y se vuelven a usar"],0],["Un invitado ha vomitado en el pasillo:",["Delimitas la zona y avisas para aplicar el procedimiento con las protecciones previstas","Lo limpias con una servilleta de tela sin guantes","Lo tapas con un mantel","Lo ignoras"],0],["Te pinchas con un palillo usado al recoger una bandeja:",["Lavas la zona, lo comunicas y solicitas valoración sanitaria","No dices nada","Te pones una tirita y sigues sin comunicarlo","Lo chupas para limpiarlo"],0]]}
]};
const M9={t:"Productos químicos de limpieza",fmin:2,s:"Etiquetas, fichas de seguridad, uso seguro de los productos de limpieza y actuación ante una exposición.",L:[
{t:"Productos de limpieza: etiquetas y fichas de seguridad",ico:"🧴",min:6,src:"Reglamento (CE) 1272/2008 (CLP); RD 374/2001",obj:["Interpretar los pictogramas y las frases de la etiqueta.","Saber para qué sirve la ficha de datos de seguridad.","Conservar los productos en sus envases originales."],b:[["1. La etiqueta",FIGI("assets/l26-quimicos.webp","Trabajadora de cátering con guantes y gafas leyendo los pictogramas de la etiqueta de un producto de limpieza","Antes de usar un producto, lee la etiqueta: te dice qué peligro tiene y cómo protegerte.")+"<p>Detergentes, desengrasantes, lejía, desinfectantes y los concentrados del lavavajillas pueden causar <b>irritaciones, quemaduras en piel y ojos</b> o problemas respiratorios. La etiqueta indica:</p>"+UL(["<b>Pictogramas</b> de peligro (rombo rojo): corrosivo, irritante, peligroso para el medio ambiente…","Palabra de advertencia: <b>«Peligro»</b> o <b>«Atención»</b>.","Indicaciones de peligro (frases H) y consejos de prudencia (frases P): cómo usarlo, qué protección llevar y qué hacer en caso de accidente."])],["2. Ficha de datos de seguridad","<p>La <b>ficha de datos de seguridad (FDS)</b> amplía la información: composición, primeros auxilios, protección necesaria, cómo actuar ante un derrame. La empresa debe tenerla disponible; pide que te la enseñen si tienes dudas.</p>"+UL(["Usa solo productos <b>autorizados por la empresa</b>.","Conserva los productos en sus <b>envases originales</b>, cerrados y etiquetados. <b>Nunca</b> los traspases a botellas de agua, de bebidas o a recipientes de alimentos.","Guárdalos separados de alimentos y menaje, lejos del calor."])]],key:"Lee la etiqueta antes de usar un producto: pictogramas, palabra de advertencia y consejos de prudencia. La ficha de seguridad amplía la información. Solo productos autorizados, en su envase original, cerrados, etiquetados y separados de los alimentos.",q:[["La información sobre los peligros de un producto de limpieza y cómo protegerse está en:",["La etiqueta y la ficha de datos de seguridad","El ticket de compra","El color del envase","Ningún sitio"],0],["Trasvasar lejía a una botella de agua vacía:",["No se hace nunca: los productos van en su envase original etiquetado","Es práctico para llevarla al evento","Se puede si se escribe a mano","Se hace si la botella es transparente"],0],["El rombo rojo con un símbolo en la etiqueta es:",["Un pictograma de peligro","Un sello de calidad","El logotipo del fabricante","Una fecha de caducidad"],0],["La ficha de datos de seguridad incluye:",["Primeros auxilios, protección necesaria y actuación ante derrames","El precio del producto","La receta del menú","El horario del servicio"],0]]},
{t:"Uso seguro y exposición accidental",ico:"🧤",min:5,src:"RD 374/2001; RD 773/1997",obj:["Diluir y aplicar los productos sin riesgos.","No mezclar productos incompatibles.","Actuar ante una salpicadura, una inhalación o un derrame."],b:[["1. Uso seguro",FIGI("assets/l27-exposicion.webp","Trabajadora de cátering lavándose con abundante agua tras una salpicadura mientras un compañero consulta la ficha de seguridad","Ante una salpicadura, agua abundante y la ficha del producto a mano para el personal sanitario.")+UL(["Respeta la <b>dilución</b>, el método y el tiempo de uso indicados. Más producto no limpia mejor y aumenta el riesgo.","<b>No mezcles productos</b>; en especial, nunca mezcles <b>lejía con amoniaco ni con ácidos</b> (desincrustantes, antical): se desprenden gases tóxicos.","No pulverices cerca de personas, alimentos ni equipos eléctricos. Ventila y evita respirar los aerosoles.","Usa los <b>guantes resistentes al producto</b> y la protección ocular que indiquen la etiqueta o la ficha.","No improvises trasvases ni la limpieza de dosificadores; señaliza las zonas húmedas."])],["2. Si se produce una exposición",UL(["Detén la tarea y evita seguir en contacto con el producto.","Salpicadura en piel u ojos: <b>lava con abundante agua</b> durante varios minutos y sigue las indicaciones de la ficha. Retira la ropa contaminada si puede hacerse con seguridad.","No neutralices el producto sobre la piel ni provoques el vómito si se ha ingerido.","Solicita asistencia y lleva la <b>etiqueta o la ficha</b> del producto. Ante síntomas importantes o dificultad respiratoria, llama al 112."])+ALERT("Ante un derrame importante o vapores intensos: aléjate, impide el acceso y avisa. No lo limpies sin los medios e instrucciones adecuados.")]],key:"Respeta la dilución, ventila y usa guantes y gafas si se indican. Nunca mezcles lejía con amoniaco o ácidos. Si hay salpicadura, agua abundante y la ficha del producto al sanitario; no provoques el vómito. Derrame grande: aléjate, aísla y avisa.",q:[["¿Qué mezcla de productos es especialmente peligrosa?",["Lejía con amoniaco o con ácidos","Agua con jabón neutro","Agua con agua","Ninguna, se pueden mezclar todos"],0],["Te salpica desengrasante en un ojo:",["Lavas con abundante agua varios minutos y pides asistencia con la etiqueta del producto","Te frotas el ojo","Esperas a que se pase","Te echas otro producto para neutralizarlo"],0],["Echar más producto del indicado:",["No limpia mejor y aumenta el riesgo","Limpia el doble","Es obligatorio","Ahorra tiempo sin riesgo"],0],["Un compañero ha ingerido por error un producto de limpieza:",["No le provocas el vómito, pides asistencia y facilitas la etiqueta","Le provocas el vómito","Le das leche y que siga trabajando","No haces nada"],0]]}
]};
const M10={t:"Organización del trabajo, clientes y desplazamientos",fmin:3,s:"Turnos y fatiga, trato con clientes y acoso, conducción de furgonetas y zonas de carga y descarga.",L:[
{t:"Turnos largos, nocturnos y fatiga",ico:"🌙",min:5,src:"Ley 31/1995, arts. 15 y 26; Estatuto de los Trabajadores, arts. 34-38",obj:["Reconocer los efectos de los horarios variables y nocturnos.","Saber qué debe organizar la empresa y qué puedes aportar tú.","Comunicar la fatiga y los conflictos a tiempo."],b:[["1. Fatiga, estrés y desgaste",FIGI("assets/l28-turnos.webp","Trabajadora de cátering cansada al final de un evento nocturno hablando con su responsable junto al cuadrante de turnos","La fatiga se previene organizando el trabajo, no solo aguantando.")+"<p>Los <b>horarios variables</b>, los eventos que terminan de madrugada, los picos de servicio, la falta de personal o las instrucciones contradictorias generan tensión, errores y sobrecarga. La prevención requiere una <b>organización realista</b> del trabajo, no solo estrategias individuales para soportar la presión.</p>"],["2. Qué se organiza y qué aportas",UL(["La empresa debe planificar dotación, horarios, tareas y <b>pausas</b>; comunicar los cambios con antelación y mantener un responsable accesible durante el servicio.","Aclara tus funciones y prioridades antes de empezar. Si hay órdenes incompatibles, falta material o el volumen supera la capacidad del equipo, <b>informa para reorganizar</b>.","Solicita apoyo antes de que el exceso de trabajo obligue a saltarse medidas de seguridad.","Cuida el descanso entre servicios; el trabajo nocturno tiene derecho a una <b>vigilancia de la salud</b> específica.","Comunica la fatiga persistente, los conflictos y las dificultades de descanso."])+NOTE("Tras un servicio largo o nocturno, presta especial atención al <b>cansancio al volver a casa</b>. Si no estás en condiciones de conducir, comunícalo y busca una alternativa.")]],key:"La fatiga se previene con una organización realista: personal suficiente, pausas, horarios comunicados y un responsable accesible. Aclara tus tareas, avisa si el volumen te supera, cuida el descanso y comunica la fatiga antes de que te haga saltarte medidas de seguridad.",q:[["Ante un volumen de trabajo que supera la capacidad del equipo:",["Informas al responsable para reorganizar o pedir apoyo","Te saltas las medidas de seguridad para llegar","Trabajas sin pausas hasta caer","No dices nada"],0],["La prevención de la fatiga y el estrés depende sobre todo de:",["Una organización realista: personal, pausas, horarios y responsable accesible","Aguantar sin quejarse","Tomar café en abundancia","La suerte"],0],["Al terminar un evento de madrugada estás muy cansado para conducir:",["Lo comunicas y buscas una alternativa de desplazamiento","Conduces con la ventanilla abierta","Conduces más rápido para llegar antes","Te tomas un energético y conduces"],0],["Si recibes dos órdenes incompatibles de personas distintas:",["Pides aclarar prioridades al responsable","Eliges la más rápida","Haces las dos a la vez corriendo","Te vas a casa"],0]]},
{t:"Trato con clientes, conflictos y acoso",ico:"🗣️",min:5,src:"Ley 31/1995; Ley Orgánica 10/2022; protocolos de acoso de la empresa",obj:["Actuar ante un cliente o asistente agresivo.","Reconocer las conductas inaceptables y el acoso.","Conocer el canal para comunicarlo."],b:[["1. Conflictos y agresiones",FIGI("assets/l29-clientes.webp","Camarera de cátering escuchando con calma y a distancia a un invitado enfadado mientras se acerca su responsable","Distancia, calma y apoyo del responsable: nunca te quedes sola o solo ante una amenaza.")+UL(["Mantén un trato respetuoso y una <b>distancia</b> que te permita retirarte.","Ante una persona agresiva o ebria: no discutas ni intentes sujetarla; <b>interrumpe la interacción</b> y pide apoyo al responsable o a seguridad.","No permanezcas a solas ante una amenaza. Si hay peligro inmediato, retírate y llama al 112.","Comunica siempre los incidentes de violencia, aunque no haya lesiones."])],["2. Acoso y conductas inaceptables","<p>No son admisibles las amenazas, humillaciones, expresiones discriminatorias, <b>conductas sexuales no deseadas</b> ni el acoso sexual o por razón de sexo, tampoco por medios digitales, vengan de compañeros, responsables, clientes o asistentes.</p>"+UL(["Comunica estas situaciones a través del <b>procedimiento de la empresa</b>. Si no conoces el canal, pídelo a tu responsable.","La empresa debe informarte del procedimiento y tramitar las comunicaciones con confidencialidad y sin represalias."])+NOTE("En domicilios o exteriores, pide que los <b>animales</b> queden apartados de las zonas de trabajo si pueden provocar golpes, mordeduras o tropiezos. No intentes sujetarlos.")]],key:"Ante un cliente agresivo: distancia, no discutir ni sujetar, cortar la interacción y pedir apoyo; si hay peligro, retirarse y 112. El acoso y las conductas sexuales no deseadas no se toleran: comunícalos por el canal de la empresa.",q:[["Un invitado ebrio se pone agresivo contigo:",["Mantienes la distancia, cortas la interacción y pides apoyo al responsable o a seguridad","Discutes con él para que se calme","Intentas sujetarlo","Le sigues sirviendo alcohol"],0],["Un asistente hace comentarios sexuales no deseados a una camarera:",["Es una conducta inaceptable que se comunica por el procedimiento de la empresa","Es normal en los eventos","Hay que aguantarlo porque es un cliente","Solo es grave si ocurre dentro de la empresa"],0],["Un incidente de violencia verbal sin lesiones:",["También se comunica","No se comunica","Solo se comunica si hay testigos","Se olvida"],0],["En un domicilio, el perro del cliente se mete en la zona de trabajo:",["Pides que lo aparten; no intentas sujetarlo tú","Lo coges en brazos","Lo echas a empujones","Sigues trabajando con él entre las piernas"],0]]},
{t:"Conducción de furgonetas y desplazamientos",ico:"🚐",min:6,src:"RD Legislativo 6/2015 (Ley de Tráfico); Ley 31/1995",obj:["Conducir por trabajo de forma segura.","Asegurar la carga en la furgoneta.","Saber que los accidentes in itinere y en misión son accidentes de trabajo."],b:[["1. Cuando conduces por trabajo",FIGI("assets/l30-furgoneta.webp","Trabajadora de cátering conduciendo una furgoneta con el cinturón puesto y la carga sujeta detrás","Cinturón, carga sujeta y el móvil en su soporte, sin usarlo.")+UL(["Conduce solo si tienes el <b>permiso correspondiente y autorización</b> para usar el vehículo. Comprueba neumáticos, luces y posibles anomalías.","<b>Planifica</b> el recorrido con tiempo; no recuperes retrasos aumentando la velocidad.","Usa siempre el <b>cinturón</b>, también en trayectos cortos y como pasajero.","<b>No uses el móvil</b> al volante; para consultar mensajes o la ruta, estaciona en un lugar seguro.","No conduzcas bajo los efectos del alcohol, drogas, medicamentos que alteren la capacidad o con fatiga. Comunica si no estás en condiciones.","Adapta la conducción a lluvia, visibilidad y tráfico."])],["2. La carga",UL(["<b>Sujeta los bultos</b> con cinchas o barras para que no se desplacen en una frenada; lo pesado abajo y contra la mampara.","No lleves material suelto en la cabina ni que obstruya la visión.","No superes la <b>carga máxima</b> del vehículo."])+NOTE("Los accidentes al ir o volver del trabajo (<b>in itinere</b>) y durante los desplazamientos por trabajo (<b>en misión</b>) se consideran accidentes de trabajo y deben comunicarse. Ante una avería en carretera, aplica las instrucciones de emergencia vial y evita exponerte al tráfico.")]],key:"Conduce solo con permiso y autorización, vehículo revisado, cinturón siempre, sin móvil, sin alcohol ni fatiga y sin recuperar retrasos con velocidad. Carga sujeta y sin superar el máximo. Los accidentes in itinere y en misión se comunican.",q:[["Mientras conduces la furgoneta hacia un evento, suena un mensaje del responsable:",["Esperas a estacionar en un lugar seguro para leerlo","Lo lees en el semáforo","Contestas mientras conduces","Lo lees a velocidad baja"],0],["La carga en la furgoneta debe ir:",["Sujeta con cinchas o barras, lo pesado abajo y sin superar la carga máxima","Suelta para descargar más rápido","En el asiento del copiloto sin sujetar","Apilada hasta el techo sin sujeción"],0],["Un accidente de tráfico al volver a casa tras un evento:",["Se considera accidente de trabajo in itinere y se comunica","No tiene relación con el trabajo","Solo cuenta si hay heridos graves","No se comunica"],0],["Llegas tarde a montar un evento:",["Avisas del retraso y no aumentas la velocidad","Aceleras para recuperar tiempo","Te saltas los semáforos en ámbar","Usas el arcén"],0]]},
{t:"Zonas de carga y descarga",ico:"🦺",min:4,src:"RD 486/1997; RD 171/2004",obj:["Moverse como peatón en zonas con vehículos.","Cargar y descargar con el vehículo inmovilizado y fuera del tráfico.","Usar prendas de alta visibilidad cuando estén previstas."],b:[["1. Como peatón en el evento",FIGI("assets/l31-carga.webp","Furgoneta aparcada en una zona de carga con calzo en la rueda y trabajadora con chaleco reflectante descargando un carro","Vehículo inmovilizado, zona acordada fuera del tráfico y chaleco de alta visibilidad cuando esté previsto.")+UL(["Usa los accesos y recorridos peatonales.","Mantente fuera del radio de maniobra de los vehículos y evita los <b>ángulos muertos</b>, sobre todo en marcha atrás.","No pases entre un vehículo y una pared, ni detrás de una furgoneta que está maniobrando. <b>No des por hecho que el conductor te ha visto</b>."])],["2. Carga y descarga",UL(["Se hace en una <b>zona acordada</b>, con el vehículo parado, el motor apagado y el freno puesto, y sin exposición al tráfico.","Si falta espacio seguro, informa para reorganizar la operación.","Usa <b>prendas de alta visibilidad</b> cuando estén previstas para la tarea y no invadas la calzada para dirigir maniobras sin organización ni medios.","Usa la rampa o la plataforma elevadora del vehículo según sus instrucciones, sin ponerte debajo de la carga."])]],key:"En zonas con vehículos: recorridos peatonales, fuera del radio de maniobra y de los ángulos muertos, y nunca detrás de una furgoneta que maniobra. Carga y descarga en zona acordada, vehículo inmovilizado, fuera del tráfico y con chaleco cuando esté previsto.",q:[["Una furgoneta está dando marcha atrás en la zona de carga:",["Te mantienes fuera de su recorrido y de los ángulos muertos","Pasas por detrás rápidamente","Te colocas detrás para guiarla sin que te vea","Das por hecho que el conductor te ve"],0],["La descarga del material se hace:",["En una zona acordada, con el vehículo inmovilizado y fuera del tráfico","En doble fila con el motor encendido","En mitad de la calzada","Donde sea más rápido"],0],["El chaleco de alta visibilidad se usa:",["Cuando está previsto para la tarea en zonas con tráfico o vehículos","Nunca en cátering","Solo de noche en casa","Como delantal"],0],["No hay un espacio seguro para descargar frente al local:",["Informas para reorganizar la operación","Descargas en mitad de la carretera","Descargas en la acera bloqueando una salida de emergencia","Dejas el material en la calzada"],0]]}
]};
const M11={t:"Protección personal, salud y emergencias",fmin:3,s:"Equipos de protección, vigilancia de la salud, emergencias, primeros auxilios y comprobaciones de cada servicio.",L:[
{t:"Equipos de protección individual",ico:"🧤",min:5,src:"RD 773/1997; UNE-EN ISO 20347; UNE-EN 407; UNE-EN 388",obj:["Conocer los EPI habituales del puesto.","Usarlos y conservarlos correctamente.","Saber que el EPI no sustituye a las demás medidas."],b:[["1. Los EPI del puesto",FIGI("assets/l32-epi.webp","Calzado antideslizante, guantes térmicos largos, guante anticorte, guantes de nitrilo, gafas y chaquetilla sobre un banco","Cada EPI protege frente a un riesgo concreto: no se intercambian.")+T(["Riesgo","EPI","Referencia"],[["Resbalones","Calzado de trabajo antideslizante, cerrado y sujeto al pie","UNE-EN ISO 20347"],["Contacto con recipientes y superficies calientes","Guantes de protección térmica, secos y en buen estado","UNE-EN 407"],["Cortes con cuchillos o vidrio","Guantes anticorte (por ejemplo, de malla)","UNE-EN 388"],["Productos de limpieza","Guantes resistentes al producto y gafas si se indican","Según la ficha de seguridad"],["Frío intenso en cámaras","Ropa de protección frente al frío","UNE-EN 342 / 14058"],["Tráfico en zonas de carga","Prendas de alta visibilidad","UNE-EN ISO 20471"]])+NOTE("No confundas los guantes térmicos con los de limpieza o los desechables: un guante desechable no protege ni del calor ni de los cortes.")],["2. Uso y conservación",UL(["La empresa selecciona y te facilita los EPI <b>gratuitamente</b> e informa sobre su uso.","Comprueba su talla, estado y compatibilidad; sigue las instrucciones de colocación, limpieza y conservación.","Sustituye los EPI deteriorados (guantes térmicos húmedos o rotos, suelas gastadas) y comunica cualquier falta de material.","Los EPI <b>no sustituyen</b> la corrección de las condiciones inseguras."])]],key:"Calzado antideslizante, guantes térmicos, anticorte y de limpieza, ropa contra el frío y alta visibilidad, cada uno para su riesgo. La empresa los facilita gratis; tú los usas, cuidas y pides su reposición. Son la última barrera.",q:[["Para coger una bandeja que sale del horno se usan:",["Guantes de protección térmica secos","Guantes desechables de nitrilo","Guantes de lana","Guantes anticorte de malla"],0],["Los EPI los paga:",["La empresa; son gratuitos para el trabajador","El trabajador","A medias","El cliente del evento"],0],["Unos guantes térmicos están húmedos y con un agujero:",["Se sustituyen y se comunica","Se siguen usando","Se usan con un trapo debajo","Se cosen y listo"],0],["El EPI, en la jerarquía preventiva:",["Es la última barrera y no sustituye a corregir las condiciones inseguras","Es la primera medida","Hace innecesario limpiar los derrames","Elimina el riesgo"],0]]},
{t:"Vigilancia de la salud y especial sensibilidad",ico:"🩺",min:5,src:"Ley 31/1995, arts. 22, 25 y 26",obj:["Conocer cómo funciona la vigilancia de la salud.","Comunicar las situaciones que puedan requerir adaptación.","Saber que las decisiones médicas corresponden al médico del trabajo."],b:[["1. Vigilancia de la salud",FIGI("assets/l33-salud.webp","Trabajadora de cátering conversando con el médico del trabajo en una consulta","Los reconocimientos son confidenciales: la empresa solo conoce la aptitud para el puesto.")+UL(["La empresa te <b>ofrecerá</b> reconocimientos médicos según los riesgos de tu puesto (cargas, posturas, trabajo nocturno, productos químicos…).","Por norma general son <b>voluntarios</b>. Al terminar este curso podrás indicar si quieres o no hacerlos.","Los resultados son <b>confidenciales</b>: la empresa solo conoce si eres apto o no para el puesto. Qué pruebas se hacen y qué significan los resultados lo decide el <b>médico del trabajo</b>."])],["2. Embarazo, lactancia y especial sensibilidad",UL(["Comunica por el canal previsto las situaciones que puedan requerir <b>adaptación</b> (embarazo, lactancia, una lesión, una enfermedad o una discapacidad) para que la empresa y el servicio de prevención valoren tus condiciones de trabajo.","La valoración tiene en cuenta las exposiciones reales: cargas, posturas, estar de pie, horarios y nocturnidad, productos químicos, calor y frío.","Respeta las medidas y restricciones indicadas y no asumas tareas nuevas que sean incompatibles con ellas."])+NOTE("La información sanitaria la trata de forma confidencial el personal sanitario. Las limitaciones de peso o de tareas no se aplican «de forma genérica»: las determina la valoración del médico del trabajo.")]],key:"La vigilancia de la salud es, por norma general, voluntaria y confidencial; la empresa solo conoce la aptitud y las decisiones médicas las toma el médico del trabajo. Comunica embarazo, lactancia o especial sensibilidad para que se valore y adapte tu puesto.",q:[["Los resultados de los reconocimientos médicos:",["Son confidenciales; la empresa solo conoce la aptitud","Los recibe tu encargado completos","Se cuelgan en el tablón","Los decide la empresa"],0],["Una trabajadora embarazada debe:",["Comunicarlo por el canal previsto para que se valore y adapte su puesto","Ocultarlo hasta que se note","Dejar de trabajar sin avisar","Decidir sola qué cargas puede llevar"],0],["¿Quién decide qué pruebas médicas se hacen y qué significan los resultados?",["El médico del trabajo","El encargado del evento","El propio trabajador","Los compañeros"],0],["Tras una lesión de espalda te han indicado restricciones de carga:",["Las respetas y no asumes tareas incompatibles","Las ignoras si hay mucho trabajo","Las aplicas solo cuando te ve el encargado","Cargas igual pero más despacio"],0]]},
{t:"Emergencias, incendio y evacuación en eventos",ico:"🚨",min:6,src:"Ley 31/1995, art. 20; RD 393/2007 (Norma Básica de Autoprotección)",obj:["Dar la alarma correctamente ante un incendio o una situación peligrosa.","Evacuar y ayudar a evacuar a los asistentes.","Usar un extintor solo en las condiciones adecuadas."],b:[["1. Dar la alarma",FIGI("assets/l34-emergencias.webp","Personal de cátering guiando con calma a los invitados hacia una salida de emergencia, con un extintor en la pared","En un evento, el personal conoce las salidas y ayuda a que los asistentes salgan con calma.")+UL(["Si detectas <b>fuego, humo</b> o una situación peligrosa, da la alarma y avisa al responsable del lugar.","Llama al <b>112</b> cuando proceda e indica la dirección exacta, el acceso, el tipo de emergencia y si hay personas afectadas.","Sigue las instrucciones del plan de emergencia del centro y de su personal."])],["2. Evacuar",UL(["No retrases la evacuación para recoger material.","Sal por un recorrido seguro, <b>sin correr y sin usar ascensores</b>. Cierra las puertas al salir si puedes hacerlo sin riesgo.","Ayuda a orientar a los asistentes hacia las salidas y al <b>punto de reunión</b>, siguiendo las indicaciones del personal de emergencia.","En el punto de reunión, comunica tu presencia. No vuelvas hasta recibir autorización ni atravieses zonas con humo."])],["3. Extintores",UL(["Usa un extintor <b>solo si has recibido formación</b>, el fuego es incipiente, tienes una salida segura a tu espalda y puedes actuar sin exponerte.","Apunta a la base de las llamas.","<b>No uses agua</b> sobre equipos eléctricos en tensión ni sobre aceite ardiendo.","Si el fuego no se controla de inmediato, <b>retírate</b> y cierra la puerta."])+ALERT("Ante peligro grave e inminente, interrumpe la actividad y aléjate de la zona. La vida de las personas está por delante del material y del servicio.")]],key:"Ante fuego o humo: alarma, aviso al responsable y 112 con datos claros. Evacua sin correr, sin ascensores y sin recoger material, ayuda a los asistentes y acude al punto de reunión. Extintor solo con formación, fuego pequeño y salida a tu espalda; nunca agua sobre electricidad o aceite.",q:[["Detectas humo saliendo de la zona de cocina del evento:",["Das la alarma, avisas al responsable y llamas al 112 si procede","Sigues sirviendo para no alarmar","Abres todas las puertas para ver de dónde sale","Recoges primero el material"],0],["Durante una evacuación:",["Sales sin correr, sin usar ascensores y vas al punto de reunión","Usas el ascensor para ir más rápido","Vuelves a por tu bolso","Te quedas recogiendo las bandejas"],0],["Para usar un extintor deben cumplirse estas condiciones:",["Formación, fuego incipiente y una salida segura a tu espalda","Que el fuego sea grande","Que no haya salida","Ninguna"],0],["Sobre un equipo eléctrico en llamas NO se debe usar:",["Agua","Un extintor de CO₂","Un extintor de polvo adecuado","Cortar la corriente si es seguro"],0],["Al llegar al punto de reunión:",["Comunicas tu presencia y no vuelves hasta que te autoricen","Vuelves a entrar a por material","Te vas a casa sin avisar","Entras a ver qué pasa"],0]]},
{t:"Primeros auxilios: proteger, avisar y socorrer",ico:"⛑️",min:6,src:"Ley 31/1995, art. 20; recomendaciones del Consejo Español de Resucitación",obj:["Aplicar la secuencia PAS ante un accidente.","Actuar ante quemaduras, cortes y hemorragias.","Saber qué no se debe hacer."],b:[["1. La secuencia PAS",FIGI("assets/l35-auxilios.webp","Trabajadora de cátering ayudando a un compañero a enfriar una quemadura bajo el grifo, con el botiquín abierto","Proteger, avisar y socorrer, en ese orden.")+FLOW(["Proteger","Avisar (112)","Socorrer"])+UL(["<b>Proteger</b>: asegúrate de que tú y la víctima no corréis más peligro (corriente eléctrica, fuego, tráfico, gas). No te conviertas en otra víctima.","<b>Avisar</b>: llama al 112, explica qué ha pasado, dónde y cuántas personas hay afectadas, y sigue sus instrucciones.","<b>Socorrer</b>: aplica los primeros auxilios que conozcas hasta que llegue la ayuda."])],["2. Qué hacer y qué no",UL(["No muevas a una persona lesionada salvo peligro inmediato y no le des comida, bebida ni medicación.","Si no responde o no respira con normalidad, informa al 112, sigue sus instrucciones y pide un <b>desfibrilador</b> si hay uno disponible.","<b>Quemaduras</b>: agua corriente fresca durante unos minutos, sin hielo ni cremas; no revientes las ampollas ni arranques la ropa pegada.","<b>Hemorragias</b>: presión directa sobre la herida con material limpio y guantes mientras llega la ayuda.","<b>Accidente eléctrico</b>: no toques a la persona mientras pueda seguir en contacto con la corriente; corta el suministro solo si es seguro."])+NOTE("Conoce dónde está el <b>botiquín</b> del servicio y repón lo que se use. Comunica todos los accidentes e incidentes a tu empresa para gestionar la asistencia y revisar las causas.")]],key:"PAS: proteger, avisar al 112 y socorrer. No mover al herido salvo peligro, no darle comida, bebida ni medicinas. Quemadura: agua fresca, sin hielo ni cremas. Hemorragia: presión directa. Electrocución: no tocar sin cortar la corriente. Comunica todos los accidentes.",q:[["La secuencia correcta ante un accidente es:",["Proteger, avisar y socorrer","Socorrer, proteger y avisar","Avisar y marcharse","Mover al herido y después avisar"],0],["Ante una persona herida que no corre peligro inmediato:",["No la mueves y no le das comida, bebida ni medicación","La levantas y le das agua","Le das un analgésico","La sientas en una silla"],0],["Ante una hemorragia en la mano por un corte:",["Presión directa sobre la herida con material limpio y guantes","Un torniquete inmediato en todos los casos","Agua caliente","Dejarla sangrar"],0],["Una persona no responde y no respira con normalidad:",["Avisas al 112, sigues sus instrucciones y pides un desfibrilador si lo hay","Le das agua","Esperas a que se recupere sola","La sientas"],0]]},
